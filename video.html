<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIBE ✦ Video</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --purple:#8366ff;
  --cyan:#31dfff;
  --pink:#ff4fd8;
  --bg:#07070c;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 15%,#6540ff35,transparent 30%),
    radial-gradient(circle at 90% 85%,#00ddff25,transparent 30%),
    var(--bg);
  color:white;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(#ffffff05 1px,transparent 1px),
    linear-gradient(90deg,#ffffff05 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

/* ================= NAV ================= */

nav{
  height:70px;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #ffffff0d;
  background:#07070ccc;
  backdrop-filter:blur(25px);
  position:relative;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:var(--purple);
  text-shadow:0 0 25px var(--purple);
}

.status{
  padding:8px 13px;
  border-radius:999px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  color:#888;
  font-size:10px;
}

/* ================= JOIN ================= */

#joinScreen{
  height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.hero{
  width:min(500px,100%);
  text-align:center;
}

.orb{
  width:100px;
  height:100px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
  border-radius:30px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 100px #7257ff50;
  font-size:42px;
  transform:rotate(-5deg);
}

h1{
  margin:0;
  font-size:clamp(45px,9vw,75px);
  line-height:.9;
  letter-spacing:-6px;
}

.gradient{
  background:linear-gradient(
    90deg,
    white,
    #a48dff,
    #4de4ff
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  max-width:410px;
  margin:25px auto 30px;
  color:#858591;
  line-height:1.6;
  font-size:13px;
}

.card{
  padding:24px;
  border-radius:25px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  backdrop-filter:blur(30px);
  box-shadow:0 30px 100px #0009;
}

#roomInput{
  width:100%;
  height:58px;
  border:1px solid #ffffff15;
  border-radius:16px;
  background:#00000035;
  color:white;
  text-align:center;
  font-size:18px;
  font-weight:800;
  letter-spacing:5px;
  outline:none;
}

#roomInput:focus{
  border-color:#8065ff;
  box-shadow:0 0 0 4px #8065ff15;
}

#roomInput::placeholder{
  color:#555;
}

.primary{
  width:100%;
  height:58px;
  margin-top:12px;
  border-radius:16px;
  background:linear-gradient(135deg,#795cff,#24d5ff);
  font-weight:800;
  box-shadow:0 10px 35px #674cff35;
}

.primary:hover{
  transform:translateY(-2px);
}

.create{
  margin-top:18px;
  background:none;
  color:#a696ff;
  font-size:13px;
  font-weight:600;
}

#error{
  margin-top:14px;
  color:#ff668c;
  font-size:13px;
}

/* ================= CALL ================= */

#callScreen{
  display:none;
  height:calc(100vh - 70px);
  padding:12px 20px 20px;
}

.roombar{
  height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.roomName{
  color:#777;
  font-size:11px;
}

.roomName strong{
  color:white;
  letter-spacing:4px;
}

.connected{
  color:#62f5a0;
  font-size:11px;
}

/* ================= VIDEO GRID ================= */

.videos{
  height:calc(100% - 115px);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);
  gap:12px;
}

.videoCard{
  position:relative;
  min-height:0;
  overflow:hidden;
  border-radius:24px;
  background:#111117;
  border:1px solid #ffffff12;
  box-shadow:0 25px 80px #000b;
}

.videoCard video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#09090f;
}

.videoCard.local video{
  transform:scaleX(-1);
}

.videoLabel{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:8px 11px;
  border-radius:11px;
  background:#0009;
  backdrop-filter:blur(15px);
  font-size:10px;
}

.removeButton{
  position:absolute;
  right:12px;
  top:12px;
  width:30px;
  height:30px;
  border-radius:10px;
  background:#0008;
  font-size:13px;
  display:none;
}

.emptyVideo{
  height:100%;
  display:grid;
  place-items:center;
  color:#555;
  text-align:center;
}

.emptyVideo strong{
  display:block;
  color:#aaa;
  margin-bottom:6px;
}

/* ================= CONTROLS ================= */

.controls{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.control{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ffffff0c;
  border:1px solid #ffffff15;
  backdrop-filter:blur(20px);
  font-size:18px;
  transition:.2s;
}

.control:hover{
  transform:translateY(-3px);
  background:#ffffff18;
}

.control.off{
  background:#ff386022;
  border-color:#ff386055;
}

.hangup{
  background:#ff31552b;
  border-color:#ff315555;
}

.hangup:hover{
  background:#ff315555;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  padding:12px 18px;
  border-radius:999px;
  background:#111119e8;
  border:1px solid #ffffff18;
  backdrop-filter:blur(20px);
  color:#ccc;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  body{
    overflow:auto;
  }

  nav{
    padding:0 15px;
  }

  #callScreen{
    height:auto;
    min-height:calc(100vh - 70px);
    padding:8px 10px 15px;
  }

  .videos{
    height:auto;
    grid-template-columns:1fr;
  }

  .videoCard{
    height:32vh;
  }

  .controls{
    margin-top:8px;
  }

  h1{
    letter-spacing:-4px;
  }
}
</style>
</head>

<body>

<nav>

  <div class="logo">
    VIBE<span>✦</span>
  </div>

  <div
    class="status"
    id="navStatus"
  >
    PRIVATE • 0 PEOPLE
  </div>

</nav>


<!-- ================= JOIN SCREEN ================= -->

<section id="joinScreen">

  <div class="hero">

    <div class="orb">
      ✦
    </div>

    <h1>
      <span class="gradient">Talk.</span><br>
      Together.
    </h1>

    <div class="subtitle">
      Create a private VIBE room and bring
      your friends into the same video call.
    </div>

    <div class="card">

      <input
        id="roomInput"
        maxlength="6"
        placeholder="ROOM CODE"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        class="primary"
        onclick="joinRoom()"
      >
        JOIN ROOM →
      </button>

      <button
        class="create"
        onclick="createRoom()"
      >
        + Create a new room
      </button>

      <div id="error"></div>

    </div>

  </div>

</section>


<!-- ================= CALL SCREEN ================= -->

<section id="callScreen">

  <div class="roombar">

    <div class="roomName">
      ROOM
      <strong id="roomDisplay">
        ------
      </strong>
    </div>

    <div
      class="connected"
      id="connectionStatus"
    >
      ● Connecting
    </div>

  </div>


  <div
    class="videos"
    id="videos"
  >

    <div class="videoCard local">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div class="videoLabel">
        You
      </div>

    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      id="micBtn"
      onclick="toggleMic()"
      title="Microphone"
    >
      🎤
    </button>

    <button
      class="control"
      id="camBtn"
      onclick="toggleCamera()"
      title="Camera"
    >
      📹
    </button>

    <button
      class="control hangup"
      onclick="leaveCall()"
      title="Leave"
    >
      ☎
    </button>

  </div>

</section>


<div
  class="toast"
  id="toast"
></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  deleteDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC0oSoz5Xn2-vqCz7tZL-tXITcClTmE1Mk",

  authDomain:
    "vibe-8ef48.firebaseapp.com",

  projectId:
    "vibe-8ef48",

  storageBucket:
    "vibe-8ef48.firebasestorage.app",

  messagingSenderId:
    "508522238856",

  appId:
    "1:508522238856:web:d79330d3e1d6078d83a03d"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let peer = null;

let localStream = null;

let roomCode = "";

let participantUnsubscribe = null;

let roomParticipantId = null;

const calls = new Map();

const participants = new Map();

const $ =
  id => document.getElementById(id);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      showError(
        "You need to log into VIBE first."
      );

      return;

    }

    currentUser = user;

    checkURLRoom();

  }
);


/* =========================================================
   ROOM HELPERS
========================================================= */

function randomRoom(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i = 0; i < 6; i++){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomParticipantId(){

  return (
    "p-" +
    Math.random()
      .toString(36)
      .slice(2) +
    Date.now()
  );

}


function hostPeerId(code){

  return (
    "vibe-" +
    code.toLowerCase()
  );

}


/* =========================================================
   UI
========================================================= */

function showError(message){

  $("error").textContent =
    message;

}


function toast(message){

  const el =
    $("toast");

  el.textContent =
    message;

  el.classList.add("show");

  setTimeout(
    () => {
      el.classList.remove("show");
    },
    2500
  );

}


function updatePeopleCount(){

  const count =
    participants.size + 1;

  $("navStatus").textContent =
    "LIVE • " +
    count +
    " PEOPLE";

}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom(){

  const code =
    randomRoom();

  $("roomInput").value =
    code;

  await startRoom(
    code,
    true
  );

}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom(){

  const code =
    $("roomInput")
      .value
      .trim()
      .toUpperCase();

  if(code.length !== 6){

    showError(
      "Enter a 6-character room code."
    );

    return;

  }

  await startRoom(
    code,
    false
  );

}


/* =========================================================
   START ROOM
========================================================= */

async function startRoom(
  code,
  host
){

  if(!currentUser){

    showError(
      "Still connecting to VIBE..."
    );

    return;

  }

  roomCode =
    code;

  showError("");


  try{

    /* CAMERA */

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            width:{
              ideal:1280
            },
            height:{
              ideal:720
            }
          },

          audio:true

        });


    $("localVideo")
      .srcObject =
      localStream;


    $("joinScreen")
      .style.display =
      "none";

    $("callScreen")
      .style.display =
      "block";


    $("roomDisplay")
      .textContent =
      roomCode;


    $("connectionStatus")
      .textContent =
      "● Connecting";


    /*
     * Every participant gets
     * their own PeerJS ID.
     */

    peer =
      new Peer();


    peer.on(
      "open",
      async peerId => {

        console.log(
          "Peer ID:",
          peerId
        );


        roomParticipantId =
          randomParticipantId();


        /*
         * Register ourselves
         * inside Firestore.
         */

        await setDoc(

          doc(
            db,
            "videoRooms",
            roomCode,
            "participants",
            roomParticipantId
          ),

          {

            uid:
              currentUser.uid,

            peerId:
              peerId,

            displayName:
              currentUser.displayName ||
              currentUser.email
                ?.split("@")[0] ||
              "VIBE User",

            createdAt:
              serverTimestamp()

          }

        );


        $("connectionStatus")
          .textContent =
          "● Waiting for people";


        updatePeopleCount();


        /*
         * Listen for everybody
         * joining/leaving.
         */

        listenForParticipants();


        /*
         * Host gets a shareable URL.
         */

        if(host){

          updateURL();

          toast(
            "Room created ✦"
          );

        }

        else{

          toast(
            "Joined VIBE room ✦"
          );

        }

      }
    );


    /* INCOMING CALL */

    peer.on(
      "call",
      call => {

        console.log(
          "Incoming call",
          call.peer
        );

        call.answer(
          localStream
        );

        setupCall(
          call
        );

      }
    );


    peer.on(
      "error",
      error => {

        console.error(
          "PeerJS error:",
          error
        );

        $("connectionStatus")
          .textContent =
          "● Connection error";

        toast(
          "Video connection error."
        );

      }
    );


    peer.on(
      "disconnected",
      () => {

        $("connectionStatus")
          .textContent =
          "● Disconnected";

      }
    );


  }

  catch(error){

    console.error(error);

    showError(
      getCameraError(error)
    );

  }

}


/* =========================================================
   FIRESTORE PARTICIPANTS
========================================================= */

function listenForParticipants(){

  if(participantUnsubscribe){

    participantUnsubscribe();

    participantUnsubscribe =
      null;

  }


  const ref =
    collection(
      db,
      "videoRooms",
      roomCode,
      "participants"
    );


  participantUnsubscribe =
    onSnapshot(
      ref,
      snapshot => {

        const currentIds =
          new Set();


        snapshot.forEach(
          item => {

            const data =
              item.data();

            currentIds.add(
              item.id
            );


            /*
             * Ignore ourselves.
             */

            if(
              item.id ===
              roomParticipantId
            ){

              return;

            }


            participants.set(
              item.id,
              data
            );


            /*
             * If we don't already
             * have a call with them,
             * call them.
             */

            if(
              !calls.has(
                data.peerId
              )
            ){

              callParticipant(
                data
              );

            }

          }
        );


        /*
         * Remove people who left.
         */

        for(
          const [
            id,
            data
          ] of participants
        ){

          if(
            !currentIds.has(id)
          ){

            participants.delete(id);

            removeVideo(
              data.peerId
            );

            const call =
              calls.get(
                data.peerId
              );

            if(call){

              try{
                call.close();
              }
              catch(e){}

              calls.delete(
                data.peerId
              );

            }

          }

        }


        updatePeopleCount();

      },
      error => {

        console.error(
          error
        );

        toast(
          "Couldn't load video room."
        );

      }
    );

}


/* =========================================================
   CALL PARTICIPANT
========================================================= */

function callParticipant(
  participant
){

  if(
    !peer ||
    !localStream ||
    !participant.peerId
  ){

    return;

  }


  /*
   * Prevent duplicate calls.
   */

  if(
    calls.has(
      participant.peerId
    )
  ){

    return;

  }


  console.log(
    "Calling",
    participant.peerId
  );


  const call =
    peer.call(
      participant.peerId,
      localStream,
      {
        metadata:{
          name:
            currentUser.displayName ||
            "VIBE User"
        }
      }
    );


  if(!call){

    return;

  }


  setupCall(
    call,
    participant
  );

}


/* =========================================================
   SETUP CALL
========================================================= */

function setupCall(
  call,
  participant = null
){

  calls.set(
    call.peer,
    call
  );


  call.on(
    "stream",
    remoteStream => {

      const name =
        participant?.displayName ||
        "VIBE User";


      addVideo(
        call.peer,
        remoteStream,
        name
      );


      $("connectionStatus")
        .textContent =
        "● Connected";

    }
  );


  call.on(
    "close",
    () => {

      calls.delete(
        call.peer
      );

      removeVideo(
        call.peer
      );

      updatePeopleCount();

    }
  );


  call.on(
    "error",
    error => {

      console.error(
        "Call error:",
        error
      );

      calls.delete(
        call.peer
      );

      removeVideo(
        call.peer
      );

    }
  );

}


/* =========================================================
   VIDEO UI
========================================================= */

function addVideo(
  peerId,
  stream,
  name
){

  let card =
    document.querySelector(
      `[data-peer="${peerId}"]`
    );


  /*
   * Already exists.
   */

  if(card){

    const video =
      card.querySelector(
        "video"
      );

    video.srcObject =
      stream;

    return;

  }


  card =
    document.createElement(
      "div"
    );

  card.className =
    "videoCard";


  card.dataset.peer =
    peerId;


  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  video.srcObject =
    stream;


  const label =
    document.createElement(
      "div"
    );

  label.className =
    "videoLabel";

  label.textContent =
    name;


  card.appendChild(
    video
  );

  card.appendChild(
    label
  );


  $("videos")
    .appendChild(
      card
    );

}


/* =========================================================
   REMOVE VIDEO
========================================================= */

function removeVideo(
  peerId
){

  const card =
    document.querySelector(
      `[data-peer="${peerId}"]`
    );


  if(card){

    const video =
      card.querySelector(
        "video"
      );

    if(video){

      video.srcObject =
        null;

    }

    card.remove();

  }

}


/* =========================================================
   MICROPHONE
========================================================= */

function toggleMic(){

  if(!localStream)
    return;


  const track =
    localStream
      .getAudioTracks()[0];


  if(!track)
    return;


  track.enabled =
    !track.enabled;


  $("micBtn")
    .textContent =
    track.enabled
      ? "🎤"
      : "🔇";


  $("micBtn")
    .classList.toggle(
      "off",
      !track.enabled
    );

}


/* =========================================================
   CAMERA
========================================================= */

function toggleCamera(){

  if(!localStream)
    return;


  const track =
    localStream
      .getVideoTracks()[0];


  if(!track)
    return;


  track.enabled =
    !track.enabled;


  $("camBtn")
    .textContent =
    track.enabled
      ? "📹"
      : "🚫";


  $("camBtn")
    .classList.toggle(
      "off",
      !track.enabled
    );

}


/* =========================================================
   SHARE URL
========================================================= */

function updateURL(){

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    roomCode;


  window.history.replaceState(
    {},
    "",
    url
  );


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(url)
      .then(
        () => {

          toast(
            "Invite link copied ✦"
          );

        }
      )
      .catch(
        () => {}
      );

  }

}


/* =========================================================
   URL ROOM
========================================================= */

function checkURLRoom(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const room =
    params.get("room");


  if(
    room &&
    room.length === 6
  ){

    $("roomInput")
      .value =
      room.toUpperCase();


    toast(
      "Invite received ✦"
    );

  }

}


/* =========================================================
   LEAVE
========================================================= */

async function leaveCall(){

  try{

    if(
      roomParticipantId &&
      roomCode
    ){

      await deleteDoc(

        doc(
          db,
          "videoRooms",
          roomCode,
          "participants",
          roomParticipantId
        )

      );

    }

  }
  catch(error){

    console.error(
      error
    );

  }


  cleanup();


  window.location.href =
    window.location.pathname;

}


/* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

  if(
    participantUnsubscribe
  ){

    participantUnsubscribe();

    participantUnsubscribe =
      null;

  }


  for(
    const call
    of calls.values()
  ){

    try{
      call.close();
    }
    catch(e){}

  }


  calls.clear();


  if(peer){

    try{
      peer.destroy();
    }
    catch(e){}

    peer = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {
          track.stop();
        }
      );

    localStream =
      null;

  }

}


/* =========================================================
   CAMERA ERRORS
========================================================= */

function getCameraError(
  error
){

  switch(
    error.name
  ){

    case "NotAllowedError":

      return (
        "Camera or microphone permission was blocked. " +
        "Click the 🔒 icon and allow both."
      );


    case "NotFoundError":

      return (
        "No camera or microphone was found."
      );


    case "NotReadableError":

      return (
        "Your camera or microphone is already being used."
      );


    case "SecurityError":

      return (
        "Your browser blocked camera access."
      );


    case "TypeError":

      return (
        "Camera access requires HTTPS."
      );


    default:

      return (
        "Couldn't access your camera/microphone: " +
        error.message
      );

  }

}

   EXPOSE BUTTON FUNCTIONS
========================================================= */

window.createRoom =
  createRoom;

window.joinRoom =
  joinRoom;

window.toggleMic =
  toggleMic;

window.toggleCamera =
  toggleCamera;

window.leaveCall =
  leaveCall;
