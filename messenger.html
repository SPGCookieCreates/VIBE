<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VIBE ✦</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}

:root{
  --purple:#8466ff;
  --cyan:#35dcff;
  --pink:#ff4fd8;
  --bg:#07070c;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#6947ff2c,transparent 30%),
    radial-gradient(circle at 90% 90%,#00dfff20,transparent 32%),
    var(--bg);
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(#fff5 1px,transparent 1px),
    linear-gradient(90deg,#fff5 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,#000,transparent);
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  color:white;
  border:0;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAV */

nav{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#07070ccc;
  backdrop-filter:blur(25px);
  z-index:5;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:var(--purple);
  text-shadow:0 0 25px var(--purple);
}

.navRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.online{
  color:#66f6a3;
  font-size:11px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px 1fr;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid #ffffff0d;
  padding:22px 15px;
  background:#ffffff03;
  overflow:auto;
}

.sideTitle{
  padding:0 12px 15px;
  color:#777;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.friend{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:15px;
  background:#ffffff0b;
  border:1px solid #ffffff10;
  text-align:left;
}

.friend:hover{
  background:#ffffff12;
}

.friendAvatar{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7659ff,#2fdfff);
  font-weight:800;
  position:relative;
}

.dot{
  position:absolute;
  width:10px;
  height:10px;
  right:-2px;
  bottom:-2px;
  border-radius:50%;
  background:#5bf49a;
  border:2px solid #111;
}

.friendInfo{
  min-width:0;
}

.friendName{
  font-size:13px;
  font-weight:700;
}

.friendPreview{
  margin-top:4px;
  color:#777;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CHAT */

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#ffffff02;
}

.chatHeader{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#ffffff03;
  backdrop-filter:blur(20px);
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.personAvatar{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
}

.personName{
  font-size:14px;
  font-weight:700;
}

.personStatus{
  margin-top:3px;
  color:#62f4a0;
  font-size:10px;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.headerBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff12;
  font-size:17px;
  transition:.2s;
}

.headerBtn:hover{
  background:#ffffff18;
  transform:translateY(-2px);
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 7%;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  margin:30px auto 45px;
  color:#666;
}

.welcomeIcon{
  width:65px;
  height:65px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:21px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 50px #765aff35;
  font-size:27px;
}

.welcome strong{
  display:block;
  color:#ddd;
  font-size:14px;
}

.welcome p{
  font-size:11px;
}

.messageRow{
  display:flex;
  margin:8px 0;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.messageRow.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(600px,75%);
  padding:12px 15px;
  border-radius:18px;
  background:#ffffff0b;
  border:1px solid #ffffff0d;
  color:#ddd;
  font-size:13px;
  line-height:1.5;
}

.mine .bubble{
  background:linear-gradient(135deg,#7154eccc,#387de0cc);
  border-color:#ffffff12;
  color:#fff;
  border-bottom-right-radius:5px;
}

.messageRow:not(.mine) .bubble{
  border-bottom-left-radius:5px;
}

.time{
  display:block;
  margin-top:5px;
  color:#ffffff66;
  font-size:9px;
}

/* INPUT */

.composer{
  padding:15px 7% 20px;
}

.composerBox{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:19px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  backdrop-filter:blur(25px);
  box-shadow:0 15px 50px #0008;
}

.messageInput{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.messageInput::placeholder{
  color:#666;
}

.emoji{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff08;
  font-size:18px;
}

.send{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:17px;
  box-shadow:0 5px 25px #765aff35;
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px);
}

/* EMPTY CONNECTION */

.connectOverlay{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:#07070ce8;
  backdrop-filter:blur(15px);
  z-index:50;
}

.connectCard{
  width:min(420px,90%);
  padding:30px;
  border-radius:25px;
  background:#ffffff0b;
  border:1px solid #ffffff15;
  text-align:center;
  box-shadow:0 30px 100px #000;
}

.connectCard h2{
  margin:0 0 10px;
}

.connectCard p{
  color:#888;
  font-size:12px;
  line-height:1.6;
}

.roomCode{
  margin:20px 0;
  padding:15px;
  border-radius:15px;
  background:#0005;
  color:#9d8cff;
  font-weight:800;
  letter-spacing:5px;
}

.copy{
  width:100%;
  height:50px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 18px;
  border-radius:999px;
  background:#12121beF;
  border:1px solid #ffffff15;
  backdrop-filter:blur(20px);
  font-size:11px;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:700px){

  nav{
    padding:0 15px;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .messages{
    padding:25px 15px;
  }

  .composer{
    padding:10px 10px 15px;
  }

  .chatHeader{
    padding:0 15px;
  }

  .headerBtn{
    width:38px;
    height:38px;
  }

  .bubble{
    max-width:85%;
  }
}
</style>
</head>

<body>

<div class="app">

<nav>

  <div class="logo">
    VIBE<span>✦</span>
  </div>

  <div class="navRight">

    <div class="online">
      ● ONLINE
    </div>

    <div class="avatar" id="myAvatar">
      ?
    </div>

  </div>

</nav>


<div class="main">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sideTitle">
      MESSAGES
    </div>

    <button class="friend">

      <div class="friendAvatar" id="friendAvatar">
        F
        <div class="dot"></div>
      </div>

      <div class="friendInfo">

        <div class="friendName" id="friendName">
          Friend
        </div>

        <div class="friendPreview" id="preview">
          Start a conversation...
        </div>

      </div>

    </button>

  </aside>


  <!-- CHAT -->

  <main class="chat">

    <header class="chatHeader">

      <div class="person">

        <div class="personAvatar" id="headerAvatar">
          F
        </div>

        <div>

          <div class="personName" id="headerName">
            Friend
          </div>

          <div class="personStatus" id="personStatus">
            ● Connecting
          </div>

        </div>

      </div>


      <div class="headerButtons">

        <button
          class="headerBtn"
          onclick="startVideo()"
          title="Video call"
        >
          📹
        </button>

        <button
          class="headerBtn"
          onclick="clearMessages()"
          title="Clear chat"
        >
          ⋯
        </button>

      </div>

    </header>


    <div class="messages" id="messages">

      <div class="welcome">

        <div class="welcomeIcon">
          ✦
        </div>

        <strong>
          Welcome to VIBE
        </strong>

        <p>
          Messages are sent directly between you two.
        </p>

      </div>

    </div>


    <div class="composer">

      <div class="composerBox">

        <button
          class="emoji"
          onclick="addEmoji()"
        >
          😊
        </button>

        <input
          class="messageInput"
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        >

        <button
          class="send"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

    </div>

  </main>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

let peer = null;
let connection = null;

let roomCode = "";
let isHost = false;


// ======================================
// HELPERS
// ======================================

const $ = id =>
  document.getElementById(id);


function randomRoom(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i=0;i<6;i++){

    result +=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];

  }

  return result;
}


function hostId(room){

  return "vibe-msg-" +
    room.toLowerCase();

}


function showToast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);

}


// ======================================
// USER NAME
// ======================================

let myName =
  localStorage.getItem("vibe_name");

if(!myName){

  myName =
    prompt("What's your VIBE name?") ||
    "You";

  localStorage.setItem(
    "vibe_name",
    myName
  );

}


$("myAvatar").textContent =
  myName[0].toUpperCase();


// ======================================
// ROOM
// ======================================

const params =
  new URLSearchParams(
    location.search
  );

roomCode =
  params.get("room") ||
  randomRoom();

roomCode =
  roomCode
    .toUpperCase()
    .slice(0,6);


// ======================================
// CREATE PEER
// ======================================

function startMessaging(){

  isHost =
    !params.get("room");


  if(isHost){

    peer =
      new Peer(
        hostId(roomCode)
      );

  }else{

    peer =
      new Peer();

  }


  peer.on("open", id => {

    console.log(
      "VIBE ID:",
      id
    );


    if(isHost){

      updateInvite();

      $("personStatus").textContent =
        "● Waiting for friend";

      showToast(
        "Your VIBE room is ready ✦"
      );

    }else{

      connectToHost();

    }

  });


  peer.on("connection", conn => {

    acceptConnection(conn);

  });


  peer.on("error", error => {

    console.error(error);

    if(
      error.type ===
      "peer-unavailable"
    ){

      $("personStatus").textContent =
        "● Friend not online";

      showToast(
        "Room isn't online yet."
      );

    }

  });

}


// ======================================
// CONNECT
// ======================================

function connectToHost(){

  const id =
    hostId(roomCode);

  const conn =
    peer.connect(
      id,
      {
        reliable:true
      }
    );

  acceptConnection(conn);

}


// ======================================
// ACCEPT
// ======================================

function acceptConnection(conn){

  connection = conn;

  conn.on("open",()=>{

    $("personStatus").textContent =
      "● Online";

    $("friendAvatar")
      .querySelector(".dot")
      .style.background =
      "#5bf49a";

    showToast(
      "Connected ✦"
    );

  });


  conn.on("data",data=>{

    if(!data) return;

    if(data.type === "message"){

      receiveMessage(
        data
      );

    }

  });


  conn.on("close",()=>{

    $("personStatus").textContent =
      "● Offline";

    $("friendAvatar")
      .querySelector(".dot")
      .style.background =
      "#555";

  });

}


// ======================================
// SEND
// ======================================

function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text) return;


  const message = {

    type:"message",

    text:text,

    sender:myName,

    time:Date.now()

  };


  addMessage(
    message,
    true
  );


  if(
    connection &&
    connection.open
  ){

    connection.send(
      message
    );

  }else{

    showToast(
      "Friend isn't connected."
    );

  }


  input.value = "";

  input.focus();

}


// ======================================
// RECEIVE
// ======================================

function receiveMessage(data){

  addMessage(
    data,
    false
  );

  $("preview").textContent =
    data.text;

}


// ======================================
// MESSAGE UI
// ======================================

function addMessage(
  data,
  mine
){

  const container =
    $("messages");


  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (mine ? " mine" : "");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const text =
    document.createElement("div");

  text.textContent =
    data.text;


  const time =
    document.createElement("span");

  time.className =
    "time";

  time.textContent =
    formatTime(data.time);


  bubble.appendChild(text);
  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);


  container.scrollTop =
    container.scrollHeight;


  $("preview").textContent =
    data.text;

}


// ======================================
// TIME
// ======================================

function formatTime(time){

  return new Date(time)
    .toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


// ======================================
// EMOJI
// ======================================

function addEmoji(){

  $("messageInput").value +=
    " 😊";

  $("messageInput").focus();

}


// ======================================
// ENTER TO SEND
// ======================================

$("messageInput")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter" &&
        !e.shiftKey
      ){

        e.preventDefault();

        sendMessage();

      }

    }
  );


// ======================================
// INVITE
// ======================================

function updateInvite(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    roomCode;

  history.replaceState(
    {},
    "",
    "?room=" + roomCode
  );

}


// ======================================
// CLEAR
// ======================================

function clearMessages(){

  if(
    confirm(
      "Clear this chat on your screen?"
    )
  ){

    $("messages").innerHTML = "";

  }

}


// ======================================
// VIDEO BUTTON
// ======================================

function startVideo(){

  const url =
    location.origin +
    location.pathname +
    "?video=" +
    roomCode;

  window.open(
    url,
    "_blank"
  );

}


// ======================================
// START
// ======================================

startMessaging();

</script>

</body>
</html>
