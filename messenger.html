<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VIBE ✦</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --purple:#8466ff;
  --cyan:#35dcff;
  --pink:#ff4fd8;
  --bg:#07070c;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#6947ff2c,transparent 30%),
    radial-gradient(circle at 90% 90%,#00dfff20,transparent 32%),
    var(--bg);
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(#fff5 1px,transparent 1px),
    linear-gradient(90deg,#fff5 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,#000,transparent);
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  color:white;
  border:0;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAV */

nav{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#07070ccc;
  backdrop-filter:blur(25px);
  z-index:5;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:var(--purple);
  text-shadow:0 0 25px var(--purple);
}

.navRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.online{
  color:#66f6a3;
  font-size:11px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px 1fr;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid #ffffff0d;
  padding:18px 15px;
  background:#ffffff03;
  overflow:auto;
}

.sideTitle{
  padding:0 12px 12px;
  color:#777;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.search{
  width:100%;
  height:42px;
  margin-bottom:15px;
  padding:0 13px;
  border-radius:13px;
  border:1px solid #ffffff10;
  outline:none;
  background:#ffffff08;
  color:white;
  font-size:12px;
}

.search:focus{
  border-color:#8466ff80;
  box-shadow:0 0 0 3px #8466ff12;
}

.search::placeholder{
  color:#666;
}

.userList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.friend{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border-radius:15px;
  background:transparent;
  border:1px solid transparent;
  text-align:left;
  transition:.2s;
}

.friend:hover{
  background:#ffffff0b;
  border-color:#ffffff10;
}

.addFriendBtn{
  margin-left:auto;
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:10px;
  background:#8466ff22;
  border:1px solid #8466ff35;
  color:#a995ff;
  font-size:17px;
}

.addFriendBtn:hover{
  background:#8466ff40;
  transform:scale(1.05);
}

.addFriendBtn:disabled{
  opacity:.6;
  cursor:default;
}
  
.friend.active{
  background:#8466ff16;
  border-color:#8466ff35;
}

.friendAvatar{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7659ff,#2fdfff);
  font-weight:800;
  position:relative;
}

.dot{
  position:absolute;
  width:10px;
  height:10px;
  right:-2px;
  bottom:-2px;
  border-radius:50%;
  background:#555;
  border:2px solid #111;
}

.friendInfo{
  min-width:0;
}

.friendName{
  font-size:13px;
  font-weight:700;
}

.friendPreview{
  margin-top:4px;
  color:#777;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.noUsers{
  padding:25px 10px;
  text-align:center;
  color:#666;
  font-size:11px;
}

/* CHAT */

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#ffffff02;
}

.chatHeader{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#ffffff03;
  backdrop-filter:blur(20px);
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.personAvatar{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
}

.personName{
  font-size:14px;
  font-weight:700;
}

.personStatus{
  margin-top:3px;
  color:#62f4a0;
  font-size:10px;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.headerBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff12;
  font-size:17px;
  transition:.2s;
}

.headerBtn:hover{
  background:#ffffff18;
  transform:translateY(-2px);
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 7%;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  margin:30px auto 45px;
  color:#666;
}

.welcomeIcon{
  width:65px;
  height:65px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:21px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 50px #765aff35;
  font-size:27px;
}

.welcome strong{
  display:block;
  color:#ddd;
  font-size:14px;
}

.welcome p{
  font-size:11px;
}

.messageRow{
  display:flex;
  margin:8px 0;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.messageRow.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(600px,75%);
  padding:12px 15px;
  border-radius:18px;
  background:#ffffff0b;
  border:1px solid #ffffff0d;
  color:#ddd;
  font-size:13px;
  line-height:1.5;
}

.mine .bubble{
  background:linear-gradient(135deg,#7154eccc,#387de0cc);
  border-color:#ffffff12;
  color:#fff;
  border-bottom-right-radius:5px;
}

.messageRow:not(.mine) .bubble{
  border-bottom-left-radius:5px;
}

.time{
  display:block;
  margin-top:5px;
  color:#ffffff66;
  font-size:9px;
}

/* INPUT */

.composer{
  padding:15px 7% 20px;
}

.composerBox{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:19px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  backdrop-filter:blur(25px);
  box-shadow:0 15px 50px #0008;
}

.messageInput{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.messageInput::placeholder{
  color:#666;
}

.emoji{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff08;
  font-size:18px;
}

.send{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:17px;
  box-shadow:0 5px 25px #765aff35;
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px);
}

.emptyChat{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  color:#666;
}

.emptyChatIcon{
  font-size:45px;
  margin-bottom:15px;
}

.emptyChat strong{
  color:#ddd;
  display:block;
  margin-bottom:7px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 18px;
  border-radius:999px;
  background:#12121bef;
  border:1px solid #ffffff15;
  backdrop-filter:blur(20px);
  font-size:11px;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#07070cf5;
  z-index:200;
  font-size:14px;
  font-weight:700;
}

.spinner{
  width:35px;
  height:35px;
  margin:auto auto 15px;
  border:3px solid #ffffff15;
  border-top-color:var(--purple);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:700px){

  nav{
    padding:0 15px;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .messages{
    padding:25px 15px;
  }

  .composer{
    padding:10px 10px 15px;
  }

  .chatHeader{
    padding:0 15px;
  }

  .headerBtn{
    width:38px;
    height:38px;
  }

  .bubble{
    max-width:85%;
  }
}
</style>
</head>

import {

const firebaseConfig = {

  authDomain:
    "vibe-8ef48.firebaseapp.com",

  projectId:
    "vibe-8ef48",

  storageBucket:
    "vibe-8ef48.firebasestorage.app",

  messagingSenderId:
    "508522238856",

  appId:
    "1:508522238856:web:d79330d3e1d6078d83a03d"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);



/* ==========================================
   STATE
========================================== */

let currentUser = null;
let selectedUser = null;
let unsubscribeMessages = null;

const $ = id =>
  document.getElementById(id);


/* ==========================================
   TOAST
========================================== */

function showToast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(() => {

    el.classList.remove("show");

  },2200);

}


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }

    currentUser = user;

    const name =
      user.displayName ||
      user.email?.split("@")[0] ||
      "VIBE User";

    $("myAvatar").textContent =
      name.charAt(0).toUpperCase();


    try{

      await setDoc(

        doc(
          db,
          "users",
          user.uid
        ),

        {

          uid:user.uid,

          displayName:name,

          email:user.email || "",

          photoURL:user.photoURL || "",

          lastSeen:serverTimestamp(),

          online:true

        },

        {
          merge:true
        }

      );

      await loadUsers();

    }

    catch(error){

      console.error(error);

      showToast(
        "Couldn't load VIBE users."
      );

    }


    $("loading").style.display =
      "none";

  }
);


/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers(){

  const userList =
    $("userList");

  userList.innerHTML =
    `<div class="noUsers">Loading people...</div>`;


  try{

    const snapshot =
      await getDocs(

        query(
          collection(db,"users"),
          limit(50)
        )

      );


    const users = [];


    snapshot.forEach(
      item => {

        const user =
          item.data();


        if(
          user.uid !==
          currentUser.uid
        ){

          users.push(user);

        }

      }
    );


    users.sort(
      (a,b) =>
        (a.displayName || "")
          .localeCompare(
            b.displayName || ""
          )
    );


    renderUsers(users);


    $("searchInput")
      .addEventListener(
        "input",
        () => {

          const term =
            $("searchInput")
              .value
              .trim()
              .toLowerCase();


          const filtered =
            users.filter(
              user =>
                (user.displayName || "")
                  .toLowerCase()
                  .includes(term)
            );


          renderUsers(filtered);

        }
      );

  }

  catch(error){

    console.error(error);

    userList.innerHTML =
      `<div class="noUsers">
        Couldn't load users.
      </div>`;

  }

}


/* ==========================================
   RENDER USERS
========================================== */

function renderUsers(users){

  const list =
    $("userList");

  list.innerHTML = "";


  if(!users.length){

    list.innerHTML =
      `<div class="noUsers">
        No VIBE users found.
      </div>`;

    return;

  }


  users.forEach(
    user => {

      const button =
        document.createElement("button");

      button.className =
        "friend";


      if(
        selectedUser &&
        selectedUser.uid === user.uid
      ){

        button.classList.add(
          "active"
        );

      }


      const avatar =
        document.createElement("div");

      avatar.className =
        "friendAvatar";


     if (user.photoURL) {
  avatar.innerHTML = `
    <img
      src="${user.photoURL}"
      alt=""
      style="
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:14px;
      "
    >
  `;
} else {
  avatar.textContent =
    (
      user.displayName ||
      "V"
    )
      .charAt(0)
      .toUpperCase();
}


      const dot =
        document.createElement("div");

      dot.className =
        "dot";

      avatar.appendChild(dot);


      const info =
        document.createElement("div");

      info.className =
        "friendInfo";


      const name =
        document.createElement("div");

      name.className =
        "friendName";

      name.textContent =
        user.displayName ||
        "VIBE User";


      const preview =
        document.createElement("div");

      preview.className =
        "friendPreview";

      preview.textContent =
        "Start a conversation...";


      info.appendChild(name);
      info.appendChild(preview);

 button.appendChild(avatar);
button.appendChild(info);


/* Friend button */

const addButton =
  document.createElement("button");

addButton.className =
  "addFriendBtn";

if(friendIds.has(user.uid)){

  addButton.textContent =
    "✓";

  addButton.title =
    "Friends";

  addButton.disabled =
    true;

}

else if(pendingSent.has(user.uid)){

  addButton.textContent =

  addButton.title =
    "Request sent";

  addButton.disabled =
    true;

}

else{

  addButton.textContent =
    "+";

  addButton.title =
    "Add friend";

  addButton.onclick =
    event => {

      event.stopPropagation();

      sendFriendRequest(user);

    };

}


button.appendChild(addButton);


button.onclick =
  () => selectUser(user);


      list.appendChild(button);

    }
  );

}


/* ==========================================
   SELECT USER
========================================== */

function selectUser(user){

  selectedUser =
    user;


  $("headerName").textContent =
    user.displayName ||
    "VIBE User";


 if (user.photoURL) {
  $("headerAvatar").innerHTML = `
    <img
      src="${user.photoURL}"
      alt=""
      style="
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:13px;
      "
    >
  `;
} else {
  $("headerAvatar").textContent =
    (
      user.displayName ||
      "V"
    )
      .charAt(0)
      .toUpperCase();
}

  $("personStatus").textContent =
    "● VIBE user";


  $("messageInput").disabled =
    false;

  $("messageInput").placeholder =
    "Message " +
    (
      user.displayName ||
      "them"
    ) +
    "...";


  renderUsersAfterSelection();

  loadConversation();

}


/* ==========================================
   REFRESH SIDEBAR ACTIVE STATE
========================================== */

function renderUsersAfterSelection(){

  document
    .querySelectorAll(".friend")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });

}


/* ==========================================
   CONVERSATION ID
========================================== */

function conversationId(){

  if(!currentUser || !selectedUser)
    return null;


  return [

    currentUser.uid,
    selectedUser.uid

  ].sort().join("_");

}


/* ==========================================
   LOAD CONVERSATION
========================================== */

function loadConversation(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const id =
    conversationId();


  if(!id)
    return;


  $("messages").innerHTML = "";


  const messagesRef =
    collection(
      db,
      "conversations",
      id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  unsubscribeMessages =
    onSnapshot(
      messagesQuery,

      snapshot => {

        $("messages").innerHTML =
          "";


        if(snapshot.empty){

          $("messages").innerHTML = `

            <div class="welcome">

              <div class="welcomeIcon">
                ✦
              </div>

              <strong>
                Say hey 👋
              </strong>

              <p>
                Start your VIBE conversation.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(
          item => {

            const data =
              item.data();


            addMessage(
              data,
              data.senderId ===
                currentUser.uid
            );

          }
        );

      },

      error => {

        console.error(error);

        showToast(
          "Couldn't load messages."
        );

      }

    );

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedUser
  ){

    showToast(
      "Choose someone to message first."
    );

    return;

  }


  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text)
    return;


  const id =
    conversationId();


  try{

    await setDoc(

      doc(
        db,
        "conversations",
        id
      ),

      {

        members:[
          currentUser.uid,
          selectedUser.uid
        ],

        updatedAt:
          serverTimestamp()

      },

      {
        merge:true
      }

    );


    await addDoc(

      collection(
        db,
        "conversations",
        id,
        "messages"
      ),

      {

        text:text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          currentUser.email
            ?.split("@")[0] ||
          "VIBE User",

        createdAt:
          serverTimestamp(),

        clientTime:
          Date.now()

      }

    );


    input.value = "";

    input.focus();

  }

  catch(error){

    console.error(error);

    showToast(
      "Message couldn't send."
    );

  }

}


/* ==========================================
   MESSAGE UI
========================================== */

function addMessage(
  data,
  mine
){

  const container =
    $("messages");


  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (mine ? " mine" : "");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const text =
    document.createElement("div");

  text.textContent =
    data.text || "";


  const time =
    document.createElement("span");

  time.className =
    "time";


  let timestamp =
    data.createdAt;


  if(
    timestamp &&
    typeof timestamp.toDate ===
      "function"
  ){

    timestamp =
      timestamp.toDate();

  }

  else if(data.clientTime){

    timestamp =
      new Date(
        data.clientTime
      );

  }

  else{

    timestamp =
      new Date();

  }


  time.textContent =
    formatTime(timestamp);


  bubble.appendChild(text);
  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);


  container.scrollTop =
    container.scrollHeight;

}


/* ==========================================
   TIME
========================================== */

function formatTime(time){

  return new Date(time)
    .toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


/* ==========================================
   EMOJI
========================================== */

function addEmoji(){

  const input =
    $("messageInput");


  if(input.disabled)
    return;


  input.value +=
    " 😊";

  input.focus();

}


/* ==========================================
   ENTER TO SEND
========================================== */

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* ==========================================
   CLEAR SCREEN
========================================== */

function clearMessages(){

  if(!selectedUser){

    showToast(
      "Choose a conversation first."
    );

    return;

  }


  if(
    confirm(
      "Clear this chat from your screen?"
    )
  ){

    $("messages").innerHTML = `

      <div class="welcome">

        <div class="welcomeIcon">
          ✦
        </div>

        <strong>
          Conversation
        </strong>

        <p>
          Your saved messages are still in VIBE.
        </p>

      </div>

    `;

  }

}


/* ==========================================
   VIDEO
========================================== */

function startVideo(){

  window.location.href =
    "video.html";

}

/* ==========================================
   PROFILE PICTURE
========================================== */



$("pfpInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file || !currentUser)
      return;


    // Basic safety/size limit
    if(file.size > 5 * 1024 * 1024){

      showToast(
        "PFP must be under 5 MB."
      );

      return;

    }


    if(
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(file.type)
    ){

      showToast(
        "Please choose a JPG, PNG, or WebP."
      );

      return;

    }


    showToast(
      "Uploading PFP..."
    );


    try{

      const storageRef =
        ref(
          storage,
          "profilePictures/" +
          currentUser.uid
        );


      await uploadBytes(
        storageRef,
        file
      );


      const photoURL =
        await getDownloadURL(
          storageRef
        );


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {
          photoURL:photoURL
        },

        {
          merge:true
        }

      );


      // Update your avatar immediately
      $("myAvatar").innerHTML = `
        <img
          src="${photoURL}"
          alt="Profile"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:13px;
          "
        >
      `;


      showToast(
        "Profile picture updated ✦"
      );

    }

    catch(error){

      console.error(error);

      showToast(
        "Couldn't upload PFP."
      );

    }


    event.target.value = "";

  }
);
  
/* Make functions available to HTML */

window.sendMessage =
  sendMessage;

window.addEmoji =
  addEmoji;

window.clearMessages =
  clearMessages;

window.startVideo =
  startVideo;

</script>
