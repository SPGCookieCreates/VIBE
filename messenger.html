<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VIBE ✦</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --purple:#8b6cff;
  --purple2:#b39cff;
  --cyan:#35dcff;
  --pink:#ff4fd8;
  --green:#63f5a2;
  --red:#ff5c7a;
  --bg:#05050a;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.11);
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(112,74,255,.28),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(255,79,216,.12),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(0,220,255,.18),
      transparent 32%
    ),
    #05050a;
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

/* NEON ATMOSPHERE */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(
      rgba(255,255,255,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.07) 1px,
      transparent 1px
    );
  background-size:48px 48px;
  mask-image:
    linear-gradient(
      to bottom,
      #000,
      transparent 90%
    );
}

body:after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  left:-180px;
  bottom:-220px;
  border-radius:50%;
  background:#6d4aff22;
  filter:blur(100px);
  pointer-events:none;
  animation:ambient 9s ease-in-out infinite alternate;
}

@keyframes ambient{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(100px,-60px) scale(1.2);
  }
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
  color:white;
  border:0;
}

/* APP */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

/* NAV */

nav{
  height:72px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(5,5,10,.62);
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  z-index:5;
  box-shadow:0 8px 40px rgba(0,0,0,.2);
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-1.2px;
  text-shadow:0 0 25px rgba(255,255,255,.08);
}

.logo span{
  color:var(--purple);
  text-shadow:
    0 0 10px var(--purple),
    0 0 30px var(--purple),
    0 0 55px rgba(132,102,255,.6);
}

.navRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.online{
  color:var(--green);
  font-size:10px;
  font-weight:700;
  letter-spacing:.7px;
  text-shadow:0 0 12px rgba(99,245,162,.5);
}

.avatar{
  width:40px;
  height:40px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
  box-shadow:
    0 0 0 1px rgba(255,255,255,.14),
    0 0 25px rgba(132,102,255,.3);
  overflow:hidden;
  transition:.25s;
}

.avatar:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.2),
    0 0 35px rgba(132,102,255,.55);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:290px 1fr;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid rgba(255,255,255,.08);
  padding:20px 15px;
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  overflow:auto;
}

.sideTitle{
  padding:0 12px 12px;
  color:#777;
  font-size:9px;
  font-weight:800;
  letter-spacing:2.5px;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 12px 8px;
  color:#666;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}

.groupCreate{
  width:100%;
  height:44px;
  margin-bottom:12px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      rgba(132,102,255,.20),
      rgba(53,220,255,.10)
    );
  border:1px solid rgba(132,102,255,.3);
  color:#c5bcff;
  font-size:12px;
  font-weight:700;
  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 5px 25px rgba(80,50,200,.08);
  transition:.25s;
}

.groupCreate:hover{
  transform:translateY(-2px);
  border-color:rgba(132,102,255,.55);
  box-shadow:
    0 0 25px rgba(132,102,255,.18),
    inset 0 1px rgba(255,255,255,.1);
}

.search{
  width:100%;
  height:43px;
  margin-bottom:5px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.09);
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
  font-size:12px;
  backdrop-filter:blur(15px);
  transition:.2s;
}

.search:focus{
  border-color:rgba(132,102,255,.55);
  background:rgba(132,102,255,.07);
  box-shadow:
    0 0 0 3px rgba(132,102,255,.08),
    0 0 25px rgba(132,102,255,.08);
}

.search::placeholder{
  color:#666;
}

.userList,
.groupList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.friend{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border-radius:16px;
  background:transparent;
  border:1px solid transparent;
  text-align:left;
  transition:.22s;
}

.friend:hover{
  background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.08);
  transform:translateX(2px);
}

.friend.active{
  background:
    linear-gradient(
      100deg,
      rgba(132,102,255,.16),
      rgba(53,220,255,.045)
    );
  border-color:rgba(132,102,255,.28);
  box-shadow:
    inset 0 0 25px rgba(132,102,255,.035),
    0 0 25px rgba(100,70,255,.06);
}

.friendAvatar{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      #7659ff,
      #2fdfff
    );
  font-weight:800;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    0 5px 20px rgba(50,100,255,.15);
}

.friendAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.friendInfo{
  min-width:0;
  flex:1;
}

.friendName{
  font-size:13px;
  font-weight:700;
}

.friendPreview{
  margin-top:4px;
  color:#707078;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.noUsers{
  padding:18px 10px;
  text-align:center;
  color:#666;
  font-size:11px;
}

.groupBadge{
  margin-left:auto;
  color:#9d8cff;
  font-size:10px;
}

/* GROUP SIDEBAR */

.groupItem{
  position:relative;
}

.groupDelete{
  flex-shrink:0;
  width:30px;
  height:30px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,92,122,.07);
  border:1px solid rgba(255,92,122,.1);
  color:#ff7f98;
  font-size:12px;
  opacity:.35;
  transition:.2s;
}

.groupItem:hover .groupDelete{
  opacity:1;
}

.groupDelete:hover{
  background:rgba(255,92,122,.18);
  border-color:rgba(255,92,122,.35);
  transform:scale(1.06);
  box-shadow:0 0 18px rgba(255,92,122,.15);
}

/* CHAT */

.chat{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.012);
  overflow:hidden;
}

.chatHeader{
  height:72px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.personAvatar{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
  font-weight:800;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.12),
    0 0 25px rgba(100,80,255,.22);
}

.personAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.personName{
  font-size:14px;
  font-weight:700;
}

.personStatus{
  margin-top:3px;
  color:var(--green);
  font-size:9px;
  text-shadow:0 0 12px rgba(99,245,162,.4);
}

.headerButtons{
  display:flex;
  gap:8px;
}

.headerBtn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  font-size:17px;
  transition:.22s;
  box-shadow:
    inset 0 1px rgba(255,255,255,.04);
}

.headerBtn:hover{
  background:rgba(132,102,255,.13);
  border-color:rgba(132,102,255,.3);
  transform:translateY(-2px);
  box-shadow:
    0 0 25px rgba(132,102,255,.15);
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 7%;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar,
.sidebar::-webkit-scrollbar,
.selectList::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb,
.selectList::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.1);
  border-radius:10px;
}

.welcome{
  text-align:center;
  margin:30px auto 45px;
  color:#666;
}

.welcomeIcon{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:
    linear-gradient(
      135deg,
      rgba(132,102,255,.85),
      rgba(53,220,255,.75)
    );
  box-shadow:
    0 0 25px rgba(132,102,255,.25),
    0 0 70px rgba(53,220,255,.1);
  font-size:27px;
}

.welcome strong{
  display:block;
  color:#ddd;
  font-size:14px;
}

.welcome p{
  font-size:11px;
}

.messageRow{
  display:flex;
  margin:9px 0;
  animation:messageIn .22s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.messageRow.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(600px,75%);
  padding:12px 15px;
  border-radius:19px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  color:#ddd;
  font-size:13px;
  line-height:1.5;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    inset 0 1px rgba(255,255,255,.035),
    0 5px 25px rgba(0,0,0,.08);
}

.mine .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(113,84,236,.82),
      rgba(56,125,224,.78)
    );
  border-color:rgba(255,255,255,.13);
  color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:
    0 5px 25px rgba(90,70,220,.16);
}

.messageRow:not(.mine) .bubble{
  border-bottom-left-radius:6px;
}

.senderName{
  color:#aa9eff;
  font-size:10px;
  font-weight:700;
  margin-bottom:4px;
}

.time{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.42);
  font-size:9px;
}

/* COMPOSER */

.composer{
  flex-shrink:0;
  position:relative;
  z-index:20;
  padding:12px 7% 16px;
  background:
    linear-gradient(
      to top,
      rgba(5,5,10,.96),
      rgba(5,5,10,.72),
      transparent
    );
}

.composerBox{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:20px;
  background:rgba(20,20,30,.88);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(30px) saturate(140%);
  -webkit-backdrop-filter:blur(30px) saturate(140%);
  box-shadow:
    0 10px 45px rgba(0,0,0,.45),
    0 0 30px rgba(100,70,255,.08),
    inset 0 1px rgba(255,255,255,.08);
}

.messageInput{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.messageInput::placeholder{
  color:#777;
}

.emoji{
  flex-shrink:0;
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  font-size:18px;
  transition:.2s;
}

.emoji:hover{
  background:rgba(255,255,255,.12);
  transform:scale(1.04);
}

.send{
  flex-shrink:0;
  width:46px;
  height:46px;
  border-radius:15px;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
  font-size:17px;
  box-shadow:
    0 0 25px rgba(100,100,255,.25);
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:
    0 0 35px rgba(100,100,255,.4);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:150;
  padding:20px;
}

.modal.show{
  display:grid;
}

.modalBox{
  width:min(480px,100%);
  max-height:85vh;
  overflow:auto;
  padding:26px;
  border-radius:26px;
  background:
    linear-gradient(
      145deg,
      rgba(25,24,40,.93),
      rgba(10,10,17,.94)
    );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 30px 100px rgba(0,0,0,.75),
    0 0 80px rgba(100,70,255,.12);
  backdrop-filter:blur(35px);
}

.modalTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.modalSub{
  color:#777;
  font-size:11px;
  margin-bottom:20px;
}

.groupNameInput{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:white;
  outline:none;
  margin-bottom:15px;
}

.groupNameInput:focus{
  border-color:rgba(132,102,255,.5);
  box-shadow:0 0 20px rgba(132,102,255,.1);
}

.selectList{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:300px;
  overflow:auto;
}

.selectUser{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  border:1px solid transparent;
  transition:.2s;
}

.selectUser:hover{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.08);
}

.selectUser input{
  accent-color:#8466ff;
}

.selectAvatar{
  width:35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
  font-size:12px;
  font-weight:800;
  overflow:hidden;
}

.selectAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modalButtons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modalBtn{
  flex:1;
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  transition:.2s;
}

.modalBtn:hover{
  background:rgba(255,255,255,.1);
}

.modalBtn.primary{
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
  font-weight:800;
  border:0;
  box-shadow:0 0 25px rgba(100,90,255,.2);
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 19px;
  border-radius:999px;
  background:rgba(15,15,24,.84);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    0 10px 40px rgba(0,0,0,.35),
    0 0 25px rgba(100,70,255,.08);
  font-size:11px;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#05050af7;
  backdrop-filter:blur(15px);
  z-index:300;
  font-size:14px;
  font-weight:700;
}

.spinner{
  width:35px;
  height:35px;
  margin:auto auto 15px;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--purple);
  border-right-color:var(--cyan);
  border-radius:50%;
  animation:spin .7s linear infinite;
  box-shadow:0 0 25px rgba(132,102,255,.2);
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* MOBILE */

@media(max-width:700px){

  nav{
    height:64px;
    padding:0 14px;
  }

  .logo{
    font-size:20px;
  }

  .online{
    display:none;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .messages{
    padding:22px 12px;
  }

  .composer{
    padding:9px 9px 14px;
  }

  .chatHeader{
    height:64px;
    padding:0 13px;
  }

  .personAvatar{
    width:39px;
    height:39px;
  }

  .headerBtn{
    width:39px;
    height:39px;
  }

  .bubble{
    max-width:88%;
  }

  .composerBox{
    border-radius:18px;
  }

  .messageInput{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    Loading VIBE...
  </div>
</div>

<div class="app">

<nav>
  <div class="logo">
    VIBE<span>✦</span>
  </div>

  <div class="navRight">
    <div class="online">● ONLINE</div>

    <div class="avatar" id="myAvatar">?</div>

    <input
      type="file"
      id="pfpInput"
      accept="image/png,image/jpeg,image/webp"
      style="display:none"
    >
  </div>
</nav>

<div class="main">

<aside class="sidebar">

  <div class="sideTitle">CHATS</div>

  <button
    class="groupCreate"
    onclick="openGroupModal()"
  >
    ＋ Create Group
  </button>

  <input
    class="search"
    id="searchInput"
    placeholder="Search VIBE..."
    autocomplete="off"
  >

  <div class="sectionTitle">
    PEOPLE
  </div>

  <div
    class="userList"
    id="userList"
  ></div>

  <div class="sectionTitle">
    GROUPS
  </div>

  <div
    class="groupList"
    id="groupList"
  ></div>

</aside>

<main class="chat">

<header class="chatHeader">

  <div class="person">

    <div
      class="personAvatar"
      id="headerAvatar"
    >✦</div>

/* AUTH */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

    currentUser = user;

    const name =
      user.displayName ||

/* USERS */

async function loadUsers(){

  try{

    const snapshot =
      await getDocs(

        query(
          collection(db,"users"),
          limit(100)
        )

      );


    allUsers = [];


    snapshot.forEach(item => {

      const user =
        item.data();

      if(
        user.uid !==
        currentUser.uid
      ){

        allUsers.push(user);

      }

    });


    allUsers.sort(
      (a,b) =>
        (a.displayName || "")
          .localeCompare(
            b.displayName || ""
          )
    );


    renderSidebar();

  }

  catch(error){

    console.error(error);

    $("userList").innerHTML =
      `<div class="noUsers">
        Couldn't load users.
      </div>`;

  }

}


/* GROUPS */

async function loadGroups(){

  try{

    const groupsQuery =
      query(
        collection(db,"conversations"),
        where(
          "members",
          "array-contains",
          currentUser.uid
        ),
        where(
          "type",
          "==",
          "group"
        )
      );


    const snapshot =
      await getDocs(groupsQuery);


    allGroups = [];


    snapshot.forEach(item => {

      const group =
        item.data();


      allGroups.push({

        id:item.id,

        ...group

      });

    });


    allGroups.sort(
      (a,b) =>
        (a.name || "")
          .localeCompare(
            b.name || ""
          )
    );


    renderSidebar();

  }

  catch(error){

    console.error(error);

    $("groupList").innerHTML =
      `<div class="noUsers">
        Couldn't load groups.
      </div>`;

  }

}

function renderGroups(){

      .toLowerCase() || "";


  const filteredGroups =

    );

    list.innerHTML =

/* LOAD CONVERSATION */

function loadDMConversation(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const id =
    dmConversationId(
      selectedChat.user.uid
    );


  const messagesRef =
    collection(
      db,
      "conversations",
      id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  subscribeMessages(messagesQuery);

}


function loadGroupConversation(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      selectedChat.id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc"
    );


  subscribeMessages(messagesQuery);

}


function loadConversation(){

  if(selectedChat.type === "group"){

    loadGroupConversation();

  }

  else{

    loadDMConversation();

  }

}


/* MESSAGES */

function subscribeMessages(messagesQuery){

  $("messages").innerHTML = "";


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        $("messages").innerHTML = "";


        if(snapshot.empty){

          $("messages").innerHTML = `

            <div class="welcome">

              <div class="welcomeIcon">
                ✦
              </div>

              <strong>
                Say hey 👋
              </strong>

              <p>
                Start your VIBE conversation.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(item => {

          const data =
            item.data();

          addMessage(
            data,
            data.senderId ===
              currentUser.uid
          );

        });

      },

      error => {

        console.error(error);

        showToast(
          "Couldn't load messages."
        );

      }

    );

}


/* SEND */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedChat
  ){

    showToast(
      "Select a chat first."
    );

    return;

  }


  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text)
    return;


  try{

    let conversationId;
    let members;


    if(selectedChat.type === "group"){

      conversationId =
        selectedChat.id;

      members =
        selectedChat.members;

    }

    else{

      conversationId =
        dmConversationId(
          selectedChat.user.uid
        );

      members = [
        currentUser.uid,
        selectedChat.user.uid
      ];

    }


    await setDoc(

      doc(
        db,
        "conversations",
        conversationId
      ),

      {

        members:members,

        type:
          selectedChat.type,

        updatedAt:
          serverTimestamp()

      },

      {merge:true}

    );


    await addDoc(

      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),

      {

        text:text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          currentUser.email
            ?.split("@")[0] ||
          "VIBE User",

        createdAt:
          serverTimestamp(),

        clientTime:
          Date.now()

      }

    );


    input.value = "";

    input.focus();

  }

  catch(error){

    console.error(error);

    showToast(
      "Message couldn't send."
    );

  }

}


/* MESSAGE UI */

function addMessage(data,mine){

  const container =
    $("messages");


  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (mine ? " mine" : "");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    selectedChat &&
    selectedChat.type === "group" &&
    !mine
  ){

    const sender =
      document.createElement("div");

    sender.className =
      "senderName";

    sender.textContent =
      data.senderName ||
      "VIBE User";

    bubble.appendChild(sender);

  }


  const text =
    document.createElement("div");

  text.textContent =
    data.text || "";


  const time =
    document.createElement("span");

  time.className =
    "time";


  let timestamp =
    data.createdAt;


  if(
    timestamp &&
    typeof timestamp.toDate ===
    "function"
  ){

    timestamp =
      timestamp.toDate();

  }

  else if(data.clientTime){

    timestamp =
      new Date(data.clientTime);

  }

  else{

    timestamp =
      new Date();

  }


  time.textContent =
    formatTime(timestamp);


  bubble.appendChild(text);
  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);


  container.scrollTop =
    container.scrollHeight;

}

/* CREATE GROUP */

async function createGroup(){

  const name =
    $("groupNameInput")
      .value
      .trim();


  if(!name){

    showToast(
      "Give the group a name."
    );

    return;

  }


  const checked =
    [
      ...document
        .querySelectorAll(
          "#groupUserList input:checked"
        )
    ];


  if(!checked.length){

    showToast(
      "Choose at least one person."
    );

    return;

  }


  const selectedMembers =
    checked.map(
      checkbox =>
        checkbox.value
    );


  selectedMembers.push(
    currentUser.uid
  );


  const groupRef =
    doc(
      collection(
        db,
        "conversations"
      )
    );


  try{

    await setDoc(

      groupRef,

      {

        type:"group",

        name:name,

        members:selectedMembers,

        createdBy:
          currentUser.uid,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    const newGroup = {

      id:groupRef.id,

      type:"group",

      name:name,

      members:selectedMembers,

      createdBy:
        currentUser.uid

    };


    allGroups.push(
      newGroup
    );


    allGroups.sort(
      (a,b) =>
        (a.name || "")
          .localeCompare(
            b.name || ""
          )
    );


    selectedChat = {

      type:"group",

      id:groupRef.id,

      name:name,

      members:selectedMembers

    };


    updateChatHeader(
      name,
      null,
      selectedMembers.length +
      " members"
    );


    $("messageInput").disabled =
      false;

    $("messageInput").placeholder =
      "Message " + name + "...";


    closeGroupModal();

    renderSidebar();

    loadGroupConversation();

    showToast(
      "Group created ✦"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Couldn't create group."
    );

  }

}


/* DELETE GROUP */

async function deleteGroup(group){

  if(!currentUser){

    return;

  }


  /*
    Only the group creator can delete it.
  */

  if(
    group.createdBy !==
    currentUser.uid
  ){

    showToast(
      "Only the group creator can delete this."
    );

    return;

  }


  const groupName =
    group.name ||
    "this group";


  const confirmed =
    window.confirm(
      `Delete "${groupName}"?\n\nThis will remove the group and its messages for everyone.`
    );


  if(!confirmed){

    return;

  }


  try{

    showToast(
      "Deleting group..."
    );


    /*
      Stop listening to the group's messages
      if it is currently open.
    */

    if(
      selectedChat &&
      selectedChat.type === "group" &&
      selectedChat.id === group.id
    ){

      if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }

      selectedChat =
        null;


      $("messageInput").disabled =
        true;

      $("messageInput").value =
        "";

      $("messageInput").placeholder =
        "Select someone first...";


      $("headerName").textContent =
        "Select someone";

      $("personStatus").textContent =
        "● VIBE";

      $("headerAvatar").textContent =
        "✦";


      $("messages").innerHTML = `

        <div class="welcome">

          <div class="welcomeIcon">
            ✦
          </div>

          <strong>
            Welcome to VIBE
          </strong>

          <p>
            Select someone or create a group.
          </p>

        </div>

      `;

    }


    /*
      Delete all messages inside the group first.
      Firestore subcollections are not automatically
      removed when their parent document is deleted.
    */

    const messagesSnapshot =
      await getDocs(

        collection(
          db,
          "conversations",
          group.id,
          "messages"
        )

      );


    /*
      Firestore batches can contain up to 500 writes.
      Delete in chunks so larger groups work too.
    */

    let batch =
      writeBatch(db);

    let operationCount =
      0;


    for(
      const messageDoc
      of messagesSnapshot.docs
    ){

      batch.delete(
        messageDoc.ref
      );

      operationCount++;


      if(operationCount >= 450){

        await batch.commit();

        batch =
          writeBatch(db);

        operationCount =
          0;

      }

    }


    if(operationCount > 0){

      await batch.commit();

    }


    /*
      Finally delete the group itself.
    */

    await deleteDoc(

      doc(
        db,
        "conversations",
        group.id
      )

    );


    /*
      Remove it locally so the sidebar
      updates immediately.
    */

    allGroups =
      allGroups.filter(
        item =>
          item.id !== group.id
      );


    renderSidebar();


    showToast(
      "Group deleted ✦"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Couldn't delete the group."
    );

  }

}


/* TIME */

function formatTime(time){

  return new Date(time)
    .toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


/* EMOJI */

function addEmoji(){

  const input =
    $("messageInput");


  if(input.disabled)
    return;


  input.value +=
    " 😊";

  input.focus();

}


/* ENTER */

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* VIDEO */

function startVideo(){

  window.location.href =
    "video.html";

}


/* PROFILE PICTURE */

$("myAvatar").addEventListener(
  "click",
  () => {

    $("pfpInput").click();

  }
);


$("pfpInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if(
      !file ||
      !currentUser
    )
      return;


    if(
      file.size >
      5 * 1024 * 1024
    ){

      showToast(
        "PFP must be under 5 MB."
      );

      return;

    }


    if(
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(file.type)
    ){

      showToast(
        "Please choose JPG, PNG, or WebP."
      );

      return;

    }


    showToast(
      "Uploading PFP..."
    );


    try{

      const storageRef =
        ref(
          storage,
          "profilePictures/" +
          currentUser.uid
        );


      await uploadBytes(
        storageRef,
        file
      );


      const photoURL =
        await getDownloadURL(
          storageRef
        );


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {
          photoURL:photoURL
        },

        {merge:true}

      );


      $("myAvatar").innerHTML =
        `<img src="${photoURL}" alt="Profile">`;


      showToast(
        "Profile picture updated ✦"
      );

    }

    catch(error){

      console.error(error);

      showToast(
        "Couldn't upload PFP."
      );

    }


    event.target.value = "";

  }
);


/* EXPOSE */

window.sendMessage =
  sendMessage;

window.addEmoji =
  addEmoji;

window.startVideo =
  startVideo;

window.openGroupModal =
  openGroupModal;

window.closeGroupModal =
  closeGroupModal;

window.createGroup =
  createGroup;

window.deleteGroup =
  deleteGroup;

</script>
