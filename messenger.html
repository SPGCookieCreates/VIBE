<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIBE ✦</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}

:root{
  --purple:#8b6cff;
  --purple2:#b39cff;
  --cyan:#35dcff;
  --pink:#ff4fd8;
  --green:#63f5a2;
  --red:#ff5c7a;
  --bg:#05050a;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(112,74,255,.28),transparent 32%),
    radial-gradient(circle at 90% 15%,rgba(255,79,216,.12),transparent 25%),
    radial-gradient(circle at 85% 90%,rgba(0,220,255,.18),transparent 32%),
    #05050a;
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,#000,transparent 90%);
}

body:after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  left:-180px;
  bottom:-220px;
  border-radius:50%;
  background:#6d4aff22;
  filter:blur(100px);
  pointer-events:none;
  animation:ambient 9s ease-in-out infinite alternate;
}

@keyframes ambient{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(100px,-60px) scale(1.2)}
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  color:white;
  border:0;
}

/* APP */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

/* NAV */

nav{
  height:72px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(5,5,10,.62);
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  z-index:5;
  box-shadow:0 8px 40px rgba(0,0,0,.2);
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-1.2px;
}

.logo span{
  color:var(--purple);
  text-shadow:
    0 0 10px var(--purple),
    0 0 30px var(--purple),
    0 0 55px rgba(132,102,255,.6);
}

.navRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.online{
  color:var(--green);
  font-size:10px;
  font-weight:700;
  letter-spacing:.7px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.14),
    0 0 25px rgba(132,102,255,.3);
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:290px 1fr;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid rgba(255,255,255,.08);
  padding:20px 15px;
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  overflow:auto;
}

.sideTitle{
  padding:0 12px 12px;
  color:#777;
  font-size:9px;
  font-weight:800;
  letter-spacing:2.5px;
}

.sectionTitle{
  padding:15px 12px 8px;
  color:#666;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}

.groupCreate{
  width:100%;
  height:44px;
  margin-bottom:12px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    rgba(132,102,255,.20),
    rgba(53,220,255,.10)
  );
  border:1px solid rgba(132,102,255,.3);
  color:#c5bcff;
  font-size:12px;
  font-weight:700;
}

.search{
  width:100%;
  height:43px;
  margin-bottom:5px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.09);
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
  font-size:12px;
}

.search:focus{
  border-color:rgba(132,102,255,.55);
  box-shadow:0 0 0 3px rgba(132,102,255,.08);
}

.search::placeholder{
  color:#666;
}

.userList,.groupList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.friend{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border-radius:16px;
  background:transparent;
  border:1px solid transparent;
  text-align:left;
}

.friend:hover{
  background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.08);
}

.friend.active{
  background:linear-gradient(
    100deg,
    rgba(132,102,255,.16),
    rgba(53,220,255,.045)
  );
  border-color:rgba(132,102,255,.28);
}

.friendAvatar{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7659ff,#2fdfff);
  font-weight:800;
}

.friendInfo{
  min-width:0;
  flex:1;
}

.friendName{
  font-size:13px;
  font-weight:700;
}

.friendPreview{
  margin-top:4px;
  color:#707078;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.noUsers{
  padding:18px 10px;
  text-align:center;
  color:#666;
  font-size:11px;
}

.groupItem{
  display:flex;
  align-items:center;
  gap:4px;
}

.groupDelete{
  width:30px;
  height:30px;
  border-radius:10px;
  background:rgba(255,92,122,.07);
  border:1px solid rgba(255,92,122,.1);
  color:#ff7f98;
}

/* CHAT */

.chat{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chatHeader{
  height:72px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(25px);
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.personAvatar{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
}

.personName{
  font-size:14px;
  font-weight:700;
}

.personStatus{
  margin-top:3px;
  color:var(--green);
  font-size:9px;
}

.headerBtn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  font-size:17px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 7%;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  margin:30px auto 45px;
  color:#666;
}

.welcomeIcon{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:linear-gradient(
    135deg,
    rgba(132,102,255,.85),
    rgba(53,220,255,.75)
  );
  font-size:27px;
}

.welcome strong{
  display:block;
  color:#ddd;
  font-size:14px;
}

.welcome p{
  font-size:11px;
}

.messageRow{
  display:flex;
  margin:9px 0;
  animation:messageIn .22s ease;
}

.messageRow.mine{
  justify-content:flex-end;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.bubble{
  max-width:min(600px,75%);
  padding:12px 15px;
  border-radius:19px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  color:#ddd;
  font-size:13px;
  line-height:1.5;
}

.mine .bubble{
  background:linear-gradient(
    135deg,
    rgba(113,84,236,.82),
    rgba(56,125,224,.78)
  );
  color:#fff;
  border-bottom-right-radius:6px;
}

.messageRow:not(.mine) .bubble{
  border-bottom-left-radius:6px;
}

.senderName{
  color:#aa9eff;
  font-size:10px;
  font-weight:700;
  margin-bottom:4px;
}

.time{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.42);
  font-size:9px;
}

/* COMPOSER */

.composer{
  flex-shrink:0;
  padding:12px 7% 16px;
  background:linear-gradient(
    to top,
    rgba(5,5,10,.96),
    rgba(5,5,10,.72),
    transparent
  );
}

.composerBox{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:20px;
  background:rgba(20,20,30,.88);
  border:1px solid rgba(255,255,255,.15);
}

.messageInput{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.messageInput::placeholder{
  color:#777;
}

.emoji{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  font-size:18px;
}

.send{
  width:46px;
  height:46px;
  border-radius:15px;
  background:linear-gradient(
    135deg,
    var(--purple),
    var(--cyan)
  );
  font-size:17px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(18px);
  z-index:150;
  padding:20px;
}

.modal.show{
  display:grid;
}

.modalBox{
  width:min(480px,100%);
  max-height:85vh;
  overflow:auto;
  padding:26px;
  border-radius:26px;
  background:linear-gradient(
    145deg,
    rgba(25,24,40,.93),
    rgba(10,10,17,.94)
  );
  border:1px solid rgba(255,255,255,.12);
}

.modalTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.modalSub{
  color:#777;
  font-size:11px;
  margin-bottom:20px;
}

.groupNameInput{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:white;
  outline:none;
  margin-bottom:15px;
}

.selectList{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:300px;
  overflow:auto;
}

.selectUser{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
}

.selectAvatar{
  width:35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    135deg,
    var(--purple),
    var(--cyan)
  );
  font-size:12px;
  font-weight:800;
}

.modalButtons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modalBtn{
  flex:1;
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
}

.modalBtn.primary{
  background:linear-gradient(
    135deg,
    var(--purple),
    var(--cyan)
  );
  font-weight:800;
  border:0;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 19px;
  border-radius:999px;
  background:rgba(15,15,24,.9);
  border:1px solid rgba(255,255,255,.13);
  font-size:11px;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#05050af7;
  backdrop-filter:blur(15px);
  z-index:300;
  font-size:14px;
  font-weight:700;
}

.spinner{
  width:35px;
  height:35px;
  margin:auto auto 15px;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--purple);
  border-right-color:var(--cyan);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:700px){

  nav{
    height:64px;
    padding:0 14px;
  }

  .logo{
    font-size:20px;
  }

  .online{
    display:none;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .messages{
    padding:22px 12px;
  }

  .composer{
    padding:9px 9px 14px;
  }

  .chatHeader{
    height:64px;
    padding:0 13px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    Loading VIBE...
  </div>
</div>

<div class="app">

<nav>
  <div class="logo">
    VIBE<span>✦</span>
  </div>

  <div class="navRight">
    <div class="online">● ONLINE</div>
    <div class="avatar" id="myAvatar">?</div>
  </div>
</nav>

<div class="main">

<aside class="sidebar">

  <div class="sideTitle">CHATS</div>

  <button class="groupCreate" id="createGroupBtn">
    ＋ Create Group
  </button>

  <input
    class="search"
    id="searchInput"
    placeholder="Search VIBE..."
    autocomplete="off"
  >

  <div class="sectionTitle">PEOPLE</div>

  <div class="userList" id="userList"></div>

  <div class="sectionTitle">GROUPS</div>

  <div class="groupList" id="groupList"></div>

</aside>

<main class="chat">

<header class="chatHeader">

  <div class="person">

    <div class="personAvatar" id="headerAvatar">✦</div>

    <div>
      <div class="personName" id="headerName">
        Select someone
      </div>

      <div class="personStatus" id="personStatus">
        ● VIBE
      </div>
    </div>

  </div>

  <div class="headerButtons">

    <button
      class="headerBtn"
      id="videoBtn"
      title="Video call"
    >
      📹
    </button>

  </div>

</header>

<div class="messages" id="messages">

  <div class="welcome">
    <div class="welcomeIcon">✦</div>
    <strong>Welcome to VIBE</strong>
    <p>Select someone or create a group.</p>
  </div>

</div>

<div class="composer">

  <div class="composerBox">

    <button class="emoji" id="emojiBtn">
      😊
    </button>

    <input
      class="messageInput"
      id="messageInput"
      placeholder="Select someone first..."
      autocomplete="off"
      disabled
    >

    <button class="send" id="sendBtn">
      ➤
    </button>

  </div>

</div>

</main>
</div>
</div>

<!-- GROUP MODAL -->

<div class="modal" id="groupModal">

  <div class="modalBox">

    <div class="modalTitle">
      Create a group ✦
    </div>

    <div class="modalSub">
      Give your group a name and choose who gets invited.
    </div>

    <input
      class="groupNameInput"
      id="groupNameInput"
      placeholder="Group name..."
      maxlength="40"
    >

    <div class="selectList" id="groupUserList"></div>

    <div class="modalButtons">

      <button class="modalBtn" id="cancelGroupBtn">
        Cancel
      </button>

      <button class="modalBtn primary" id="confirmGroupBtn">
        Create Group
      </button>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  getDocs,
  serverTimestamp,
  limit,
  where,
  deleteDoc,
  writeBatch
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC0oSoz5Xn2-vqCz7tZL-tXITcClTmE1Mk",

  authDomain:
    "vibe-8ef48.firebaseapp.com",

  projectId:
    "vibe-8ef48",

  messagingSenderId:
    "508522238856",

  appId:
    "1:508522238856:web:d79330d3e1d6078d83a03d"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let selectedChat = null;
let unsubscribeMessages = null;

let allUsers = [];
let allGroups = [];


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function showToast(text){

  const toast = $("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {
      toast.classList.remove("show");
    },2500);

}


function hideLoading(){

  const loading = $("loading");

  if(loading){
    loading.style.display = "none";
  }

}


function showWelcome(){

  $("messages").innerHTML = `

    <div class="welcome">

      <div class="welcomeIcon">✦</div>

      <strong>Welcome to VIBE</strong>

      <p>
        Select someone or create a group.
      </p>

    </div>

  `;

}


function resetChat(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }

  selectedChat = null;

  $("messageInput").disabled = true;

  $("messageInput").value = "";

  $("messageInput").placeholder =
    "Select someone first...";

  $("headerName").textContent =
    "Select someone";

  $("personStatus").textContent =
    "● VIBE";

  $("headerAvatar").textContent =
    "✦";

  showWelcome();

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    /*
      IMPORTANT:
      This is the ONLY auth callback.
      The old file had a second broken callback
      sitting outside the function.
    */

    if(!user){

      currentUser = null;

      hideLoading();

      showToast("Please sign in to VIBE.");

      setTimeout(() => {

        window.location.href =
          "index.html";

      },800);

      return;

    }


    currentUser = user;


    const name =
      user.displayName ||
      user.email?.split("@")[0] ||
      "VIBE User";


    /*
      No Firebase Storage.
      We simply use the user's existing
      Firebase Auth photoURL if one exists.
    */

    if(user.photoURL){

      $("myAvatar").innerHTML =
        `<img
          src="${escapeHtml(user.photoURL)}"
          style="width:100%;height:100%;object-fit:cover;border-radius:14px"
          alt="Profile"
        >`;

    }else{

      $("myAvatar").textContent =
        name.charAt(0).toUpperCase();

    }


    try{

      /*
        Create/update the user's Firestore profile.
      */

      await setDoc(

        doc(
          db,
          "users",
          user.uid
        ),

        {
          uid:user.uid,
          displayName:name,
          email:user.email || "",
          photoURL:user.photoURL || "",
          lastSeen:serverTimestamp(),
          online:true
        },

        {merge:true}

      );


      /*
        Load both lists.
      */

      await Promise.all([
        loadUsers(),
        loadGroups()
      ]);


      hideLoading();

    }

    catch(error){

      console.error(
        "VIBE startup error:",
        error
      );

      hideLoading();

      showToast(
        "VIBE opened, but Firebase could not load your data."
      );

    }

  },

  error => {

    console.error(
      "Firebase Auth error:",
      error
    );

    hideLoading();

    showToast(
      "Firebase authentication failed."
    );

  }
);


/*
  Absolute loading-screen safety net.
  Even if Firebase hangs, the UI cannot remain
  stuck forever.
*/

setTimeout(() => {

  hideLoading();

},7000);


/* =========================================================
   USERS
========================================================= */

async function loadUsers(){

  const snapshot =
    await getDocs(

      query(
        collection(db,"users"),
        limit(100)
      )

    );


  allUsers = [];


  snapshot.forEach(item => {

    const user =
      item.data();


    if(
      currentUser &&
      user.uid !== currentUser.uid
    ){

      allUsers.push(user);

    }

  });


  allUsers.sort(
    (a,b) =>
      (a.displayName || "")
        .localeCompare(
          b.displayName || ""
        )
  );


  renderSidebar();

}


/* =========================================================
   GROUPS
========================================================= */

async function loadGroups(){

  const groupsQuery =
    query(

      collection(
        db,
        "conversations"
      ),

      where(
        "members",
        "array-contains",
        currentUser.uid
      ),

      where(
        "type",
        "==",
        "group"
      )

    );


  const snapshot =
    await getDocs(groupsQuery);


  allGroups = [];


  snapshot.forEach(item => {

    const group =
      item.data();


    allGroups.push({

      id:item.id,

      ...group

    });

  });


  allGroups.sort(
    (a,b) =>
      (a.name || "")
        .localeCompare(
          b.name || ""
        )
  );


  renderSidebar();

}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar(){

  renderUsers();

  renderGroups();

}


function renderUsers(){

  const list =
    $("userList");

  list.innerHTML = "";


  const search =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  const users =
    allUsers.filter(user => {

      const name =
        user.displayName ||
        "VIBE User";

      return name
        .toLowerCase()
        .includes(search);

    });


  if(!users.length){

    list.innerHTML =
      `<div class="noUsers">
        ${search ? "No matching users." : "No other users yet."}
      </div>`;

    return;

  }


  users.forEach(user => {

    const button =
      document.createElement("button");

    button.className =
      "friend";


    if(
      selectedChat &&
      selectedChat.type === "dm" &&
      selectedChat.id === user.uid
    ){

      button.classList.add("active");

    }


    const avatar =
      document.createElement("div");

    avatar.className =
      "friendAvatar";


    /*
      Only use Auth photoURL.
      No Storage required.
    */

    if(user.photoURL){

      avatar.innerHTML =
        `<img
          src="${escapeHtml(user.photoURL)}"
          style="width:100%;height:100%;object-fit:cover;border-radius:14px"
          alt=""
        >`;

    }else{

      avatar.textContent =
        (
          user.displayName ||
          "V"
        )
        .charAt(0)
        .toUpperCase();

    }


    const info =
      document.createElement("div");

    info.className =
      "friendInfo";


    const name =
      document.createElement("div");

    name.className =
      "friendName";

    name.textContent =
      user.displayName ||
      "VIBE User";


    const preview =
      document.createElement("div");

    preview.className =
      "friendPreview";

    preview.textContent =
      "Direct message";


    info.appendChild(name);
    info.appendChild(preview);

    button.appendChild(avatar);
    button.appendChild(info);


    button.addEventListener(
      "click",
      () => selectDM(user)
    );


    list.appendChild(button);

  });

}

    $("groupList");

  list.innerHTML = "";


  const search =

      .value
      .trim()
      .toLowerCase();


  const groups =
    allGroups.filter(group => {

      const name =
        group.name ||
        "Unnamed Group";

      return name
        .toLowerCase()
        .includes(search);

    });


  if(!groups.length){

    list.innerHTML =
      `<div class="noUsers">
        ${search ? "No matching groups." : "No groups yet."}
      </div>`;

    return;

  }


  groups.forEach(group => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "groupItem";


    const button =
      document.createElement("button");

    button.className =
      "friend";

    button.style.flex = "1";


    if(
      selectedChat &&
      selectedChat.type === "group" &&
      selectedChat.id === group.id
    ){

      button.classList.add("active");

    }


    const avatar =
      document.createElement("div");

    avatar.className =
      "friendAvatar";

    avatar.textContent =
      "✦";


    const info =
      document.createElement("div");

    info.className =
      "friendInfo";


    const name =
      document.createElement("div");

    name.className =
      "friendName";

    name.textContent =
      group.name ||
      "Unnamed Group";


    const preview =
      document.createElement("div");

    preview.className =
      "friendPreview";

    preview.textContent =

    */

    ){

/* =========================================================
   SEARCH
========================================================= */

$("searchInput")
  .addEventListener(
    "input",
    renderSidebar
  );


/* =========================================================
   DIRECT MESSAGES
========================================================= */

function selectDM(user){

  selectedChat = {

    type:"dm",

    id:user.uid,

    user:user

  };


  updateChatHeader(

    user.displayName ||
      "VIBE User",

    user.photoURL,

    "● VIBE user"

  );


  $("messageInput").disabled =
    false;

  $("messageInput").placeholder =
    `Message ${user.displayName || "them"}...`;


  renderSidebar();

  loadConversation();

}


function dmConversationId(userId){

  return [
    currentUser.uid,
    userId
  ]
  .sort()
  .join("_");

}


/* =========================================================
   GROUP CHAT
========================================================= */

function selectGroup(group){

  selectedChat = {

    type:"group",

    id:group.id,

    name:
      group.name ||
      "Unnamed Group",

    members:
      group.members || []

  };


  updateChatHeader(

    group.name ||
      "Unnamed Group",

    null,

    `${group.members?.length || 1} members`

  );


  $("messageInput").disabled =
    false;

  $("messageInput").placeholder =
    `Message ${group.name || "group"}...`;


  renderSidebar();

  loadConversation();

}


/* =========================================================
   CONVERSATION LOADING
========================================================= */

function loadConversation(){

  if(!selectedChat)
    return;


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  let conversationId;


  if(selectedChat.type === "group"){

    conversationId =
      selectedChat.id;

  }else{

    conversationId =
      dmConversationId(
        selectedChat.user.uid
      );

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  subscribeMessages(
    messagesQuery
  );

}


/* =========================================================
   MESSAGE SUBSCRIPTION
========================================================= */

function subscribeMessages(messagesQuery){

  $("messages").innerHTML = "";


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        $("messages").innerHTML = "";


        if(snapshot.empty){

          $("messages").innerHTML = `

            <div class="welcome">

              <div class="welcomeIcon">
                ✦
              </div>

              <strong>
                Say hey 👋
              </strong>

              <p>
                Start your VIBE conversation.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(item => {

          const data =
            item.data();


          addMessage(

            data,

            data.senderId ===
              currentUser.uid

          );

        });

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );

        showToast(
          "Couldn't load messages. Check Firestore rules."
        );

      }

    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedChat
  ){

    showToast(
      "Select a chat first."
    );

    return;

  }


  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text)
    return;


  try{

    let conversationId;

    let members;


    if(
      selectedChat.type === "group"
    ){

      conversationId =
        selectedChat.id;

      members =
        selectedChat.members;

    }

    else{

      conversationId =
        dmConversationId(
          selectedChat.user.uid
        );

      members = [
        currentUser.uid,
        selectedChat.user.uid
      ];

    }


    /*
      Create/update conversation.
    */

    await setDoc(

      doc(
        db,
        "conversations",
        conversationId
      ),

      {

        members,

        type:
          selectedChat.type,

        updatedAt:
          serverTimestamp()

      },

      {merge:true}

    );


    /*
      Add message.
    */

    await addDoc(

      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),

      {

        text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          currentUser.email?.split("@")[0] ||
          "VIBE User",

        createdAt:
          serverTimestamp(),

        clientTime:
          Date.now()

      }

    );


    input.value = "";

    input.focus();

  }

  catch(error){

    console.error(
      "Send message error:",
      error
    );

    showToast(
      "Message couldn't send."
    );

  }

}


/* =========================================================
   MESSAGE UI
========================================================= */

function addMessage(data,mine){

  const container =
    $("messages");


  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (mine ? " mine" : "");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    selectedChat &&
    selectedChat.type === "group" &&
    !mine
  ){

    const sender =
      document.createElement("div");

    sender.className =
      "senderName";

    sender.textContent =
      data.senderName ||
      "VIBE User";

    bubble.appendChild(sender);

  }


  const text =
    document.createElement("div");

  text.textContent =
    data.text || "";


  const time =
    document.createElement("span");

  time.className =
    "time";


  let timestamp =
    data.createdAt;


  if(
    timestamp &&
    typeof timestamp.toDate === "function"
  ){

    timestamp =
      timestamp.toDate();

  }

  else if(data.clientTime){

    timestamp =
      new Date(data.clientTime);

  }

  else{

    timestamp =
      new Date();

  }


  time.textContent =
    formatTime(timestamp);


  bubble.appendChild(text);
  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);


  container.scrollTop =
    container.scrollHeight;

}


/* =========================================================
   HEADER
========================================================= */

function updateChatHeader(
  name,
  photoURL,
  status
){

  $("headerName").textContent =
    name;

  $("personStatus").textContent =
    status;


  if(photoURL){

    $("headerAvatar").innerHTML =
      `<img
        src="${escapeHtml(photoURL)}"
        style="width:100%;height:100%;object-fit:cover;border-radius:14px"
        alt=""
      >`;

  }else{

    $("headerAvatar").textContent =
      name
        .charAt(0)
        .toUpperCase();

  }

}

   GROUP MODAL
========================================================= */

  renderGroupUsers();

function closeGroupModal(){

      </div>`;

    const label =

          alt=""
        >`;

        (
          user.displayName ||
          "V"
        )
        .charAt(0)
        .toUpperCase();

    }

    label.appendChild(checkbox);
    label.appendChild(avatar);
    label.appendChild(name);

    list.appendChild(label);

  });

}


/* =========================================================
   CREATE GROUP
========================================================= */

async function createGroup(){

  if(!currentUser){

    showToast(
      "You aren't signed in."
    );

    return;

  }


  const name =
    $("groupNameInput")
      .value
      .trim();


  if(!name){

    showToast(
      "Give the group a name."
    );

    return;

  }


  const checked =
    [
      ...document.querySelectorAll(
        "#groupUserList input:checked"
      )
    ];


  if(!checked.length){

    showToast(
      "Choose at least one person."
    );

    return;

  }


  const selectedMembers =
    checked.map(
      checkbox =>
        checkbox.value
    );


  if(
    !selectedMembers.includes(
      currentUser.uid
    )
  ){

    selectedMembers.push(
      currentUser.uid
    );

  }


  try{

    const groupRef =
      doc(
        collection(
          db,
          "conversations"
        )
      );


    await setDoc(

      groupRef,

      {

        type:"group",

        name,

        members:
          selectedMembers,

        createdBy:
          currentUser.uid,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    const newGroup = {

      id:
        groupRef.id,

      type:"group",

      name,

      members:
        selectedMembers,

      createdBy:
        currentUser.uid

    };


    allGroups.push(
      newGroup
    );


    selectedChat = {

      type:"group",

      id:
        groupRef.id,

      name,

      members:
        selectedMembers

    };


    updateChatHeader(

      name,

      null,

      `${selectedMembers.length} members`

    );


    $("messageInput").disabled =
      false;

    $("messageInput").placeholder =
      `Message ${name}...`;


    closeGroupModal();

    renderSidebar();

    loadConversation();

    showToast(
      "Group created ✦"
    );

  }

  catch(error){

    console.error(
      "Create group error:",
      error
    );

    showToast(
      "Couldn't create group."
    );

  }

}


/* =========================================================
   DELETE GROUP
========================================================= */

async function deleteGroup(group){

  if(!currentUser)
    return;


  if(
    group.createdBy !==
    currentUser.uid
  ){

    showToast(
      "Only the group creator can delete this."
    );

    return;

  }


  const confirmed =
    window.confirm(
      `Delete "${group.name || "this group"}"?\n\nThis will remove the group and its messages for everyone.`
    );


  if(!confirmed)
    return;


  try{

    showToast(
      "Deleting group..."
    );


    if(
      selectedChat &&
      selectedChat.type === "group" &&
      selectedChat.id === group.id
    ){

      resetChat();

    }


    /*
      Delete messages in batches.
    */

    const messagesSnapshot =
      await getDocs(

        collection(
          db,
          "conversations",
          group.id,
          "messages"
        )

      );


    let batch =
      writeBatch(db);

    let count = 0;


    for(
      const messageDoc
      of messagesSnapshot.docs
    ){

      batch.delete(
        messageDoc.ref
      );

      count++;


      if(count >= 450){

        await batch.commit();

        batch =
          writeBatch(db);

        count = 0;

      }

    }


    if(count > 0){

      await batch.commit();

    }


    /*
      Delete group document.
    */

    await deleteDoc(

      doc(
        db,
        "conversations",
        group.id
      )

    );


    allGroups =
      allGroups.filter(
        item =>
          item.id !== group.id
      );


    renderSidebar();

    showToast(
      "Group deleted ✦"
    );

  }

  catch(error){

    console.error(
      "Delete group error:",
      error
    );

    showToast(
      "Couldn't delete the group."
    );

  }

}


/* =========================================================
   TIME
========================================================= */

function formatTime(time){

  return new Date(time)
    .toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}

/* =========================================================
   BASIC HTML ESCAPING
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
