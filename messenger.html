<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VIBE ✦</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}

:root{
  --purple:#8466ff;
  --cyan:#35dcff;
  --pink:#ff4fd8;
  --bg:#07070c;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#6947ff2c,transparent 30%),
    radial-gradient(circle at 90% 90%,#00dfff20,transparent 32%),
    var(--bg);
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(#fff5 1px,transparent 1px),
    linear-gradient(90deg,#fff5 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,#000,transparent);
}

button,input{font-family:inherit}

button{
  cursor:pointer;
  color:white;
  border:0;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAV */

nav{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#07070ccc;
  backdrop-filter:blur(25px);
  z-index:5;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:var(--purple);
  text-shadow:0 0 25px var(--purple);
}

.navRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.online{
  color:#66f6a3;
  font-size:11px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  overflow:hidden;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px 1fr;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid #ffffff0d;
  padding:18px 15px;
  background:#ffffff03;
  overflow:auto;
}

.sideTitle{
  padding:0 12px 12px;
  color:#777;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.groupCreate{
  width:100%;
  height:42px;
  margin-bottom:12px;
  border-radius:13px;
  background:linear-gradient(135deg,#8466ff30,#35dcff20);
  border:1px solid #8466ff35;
  color:#b9adff;
  font-size:12px;
  font-weight:700;
}

.groupCreate:hover{
  background:linear-gradient(135deg,#8466ff45,#35dcff30);
}

.search{
  width:100%;
  height:42px;
  margin-bottom:15px;
  padding:0 13px;
  border-radius:13px;
  border:1px solid #ffffff10;
  outline:none;
  background:#ffffff08;
  color:white;
  font-size:12px;
}

.search:focus{
  border-color:#8466ff80;
}

.search::placeholder{
  color:#666;
}

.userList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.friend{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border-radius:15px;
  background:transparent;
  border:1px solid transparent;
  text-align:left;
  transition:.2s;
}

.friend:hover{
  background:#ffffff0b;
  border-color:#ffffff10;
}

.friend.active{
  background:#8466ff16;
  border-color:#8466ff35;
}

.friendAvatar{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7659ff,#2fdfff);
  font-weight:800;
  position:relative;
  overflow:hidden;
}

.friendAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.friendInfo{
  min-width:0;
}

.friendName{
  font-size:13px;
  font-weight:700;
}

.friendPreview{
  margin-top:4px;
  color:#777;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.noUsers{
  padding:25px 10px;
  text-align:center;
  color:#666;
  font-size:11px;
}

/* GROUP BADGE */

.groupBadge{
  margin-left:auto;
  color:#9d8cff;
  font-size:10px;
}

/* CHAT */

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#ffffff02;
}

.chatHeader{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #ffffff0d;
  background:#ffffff03;
  backdrop-filter:blur(20px);
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.personAvatar{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
  overflow:hidden;
}

.personAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.personName{
  font-size:14px;
  font-weight:700;
}

.personStatus{
  margin-top:3px;
  color:#62f4a0;
  font-size:10px;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.headerBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff12;
  font-size:17px;
}

.headerBtn:hover{
  background:#ffffff18;
  transform:translateY(-2px);
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 7%;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  margin:30px auto 45px;
  color:#666;
}

.welcomeIcon{
  width:65px;
  height:65px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border-radius:21px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 50px #765aff35;
  font-size:27px;
}

.welcome strong{
  display:block;
  color:#ddd;
  font-size:14px;
}

.welcome p{
  font-size:11px;
}

.messageRow{
  display:flex;
  margin:8px 0;
}

.messageRow.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(600px,75%);
  padding:12px 15px;
  border-radius:18px;
  background:#ffffff0b;
  border:1px solid #ffffff0d;
  color:#ddd;
  font-size:13px;
  line-height:1.5;
}

.mine .bubble{
  background:linear-gradient(135deg,#7154eccc,#387de0cc);
  color:#fff;
  border-bottom-right-radius:5px;
}

.messageRow:not(.mine) .bubble{
  border-bottom-left-radius:5px;
}

.senderName{
  color:#a99cff;
  font-size:10px;
  font-weight:700;
  margin-bottom:4px;
}

.time{
  display:block;
  margin-top:5px;
  color:#ffffff66;
  font-size:9px;
}

/* INPUT */

.composer{
  padding:15px 7% 20px;
}

.composerBox{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:19px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  backdrop-filter:blur(25px);
}

.messageInput{
  flex:1;
  min-width:0;
  height:45px;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.messageInput::placeholder{
  color:#666;
}

.emoji{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#ffffff08;
  font-size:18px;
}

.send{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:17px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:#0009;
  backdrop-filter:blur(12px);
  z-index:150;
  padding:20px;
}

.modal.show{
  display:grid;
}

.modalBox{
  width:min(480px,100%);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border-radius:25px;
  background:#111119f5;
  border:1px solid #ffffff15;
  box-shadow:0 30px 100px #000;
}

.modalTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.modalSub{
  color:#777;
  font-size:11px;
  margin-bottom:20px;
}

.groupNameInput{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:13px;
  border:1px solid #ffffff12;
  background:#ffffff08;
  color:white;
  outline:none;
  margin-bottom:15px;
}

.selectList{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:300px;
  overflow:auto;
}

.selectUser{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:13px;
  background:#ffffff05;
  border:1px solid transparent;
}

.selectUser:hover{
  background:#ffffff0b;
}

.selectUser input{
  accent-color:#8466ff;
}

.selectAvatar{
  width:35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:12px;
  font-weight:800;
  overflow:hidden;
}

.selectAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modalButtons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modalBtn{
  flex:1;
  height:45px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff12;
}

.modalBtn.primary{
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 18px;
  border-radius:999px;
  background:#12121bef;
  border:1px solid #ffffff15;
  backdrop-filter:blur(20px);
  font-size:11px;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#07070cf5;
  z-index:300;
  font-size:14px;
  font-weight:700;
}

.spinner{
  width:35px;
  height:35px;
  margin:auto auto 15px;
  border:3px solid #ffffff15;
  border-top-color:var(--purple);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:700px){

  nav{padding:0 15px}

  .main{grid-template-columns:1fr}

  .sidebar{display:none}

  .messages{padding:25px 15px}

  .composer{padding:10px 10px 15px}

  .chatHeader{padding:0 15px}

  .bubble{max-width:85%}
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    Loading VIBE...
  </div>
</div>

<div class="app">

<nav>
  <div class="logo">
    VIBE<span>✦</span>
  </div>

  <div class="navRight">
    <div class="online">● ONLINE</div>

    <div class="avatar" id="myAvatar">?</div>

    <input
      type="file"
      id="pfpInput"
      accept="image/png,image/jpeg,image/webp"
      style="display:none"
    >
  </div>
</nav>


<div class="main">

<aside class="sidebar">

  <div class="sideTitle">CHATS</div>

  <button
    class="groupCreate"
    onclick="openGroupModal()"
  >
    ＋ Create Group
  </button>

  <input
    class="search"
    id="searchInput"
    placeholder="Search VIBE..."
    autocomplete="off"
  >

  <div
    class="userList"
    id="userList"
  ></div>

</aside>


<main class="chat">

<header class="chatHeader">

  <div class="person">

    <div
      class="personAvatar"
      id="headerAvatar"
    >✦</div>

    <div>

      <div
        class="personName"
        id="headerName"
      >
        Select someone
      </div>

      <div
        class="personStatus"
        id="personStatus"
      >
        ● VIBE
      </div>

    </div>

  </div>


  <div class="headerButtons">

    <button
      class="headerBtn"
      onclick="startVideo()"
      title="Video call"
    >
      📹
    </button>

  </div>

</header>


<div
  class="messages"
  id="messages"
>

  <div class="emptyChat">

    <div>

      <div class="emptyChatIcon">✦</div>

      <strong>Welcome to VIBE</strong>

      <span>
        Select someone or create a group.
      </span>

    </div>

  </div>

</div>


<div class="composer">

  <div class="composerBox">

    <button
      class="emoji"
      onclick="addEmoji()"
    >
      😊
    </button>

    <input
      class="messageInput"
      id="messageInput"
      placeholder="Select someone first..."
      autocomplete="off"
      disabled
    >

    <button
      class="send"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>

</main>
</div>
</div>


<!-- GROUP MODAL -->

<div
  class="modal"
  id="groupModal"
>

  <div class="modalBox">

    <div class="modalTitle">
      Create a group ✦
    </div>

    <div class="modalSub">
      Give your group a name and choose who gets invited.
    </div>

    <input
      class="groupNameInput"
      id="groupNameInput"
      placeholder="Group name..."
      maxlength="40"
    >

    <div
      class="selectList"
      id="groupUserList"
    ></div>

    <div class="modalButtons">

      <button
        class="modalBtn"
        onclick="closeGroupModal()"
      >
        Cancel
      </button>

      <button
        class="modalBtn primary"
        onclick="createGroup()"
      >
        Create Group
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  getDocs,
  serverTimestamp,
  limit
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC0oSoz5Xn2-vqCz7tZL-tXITcClTmE1Mk",

  authDomain:
    "vibe-8ef48.firebaseapp.com",

  projectId:
    "vibe-8ef48",

  storageBucket:
    "vibe-8ef48.firebasestorage.app",

  messagingSenderId:
    "508522238856",

  appId:
    "1:508522238856:web:d79330d3e1d6078d83a03d"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);

const storage =
  getStorage(firebaseApp);


/* ==========================================
   STATE
========================================== */

let currentUser = null;
let selectedChat = null;
let unsubscribeMessages = null;
let allUsers = [];


/* ==========================================
   HELPERS
========================================== */

const $ = id =>
  document.getElementById(id);


function showToast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  },2200);

}


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }

    currentUser = user;

    const name =
      user.displayName ||
      user.email?.split("@")[0] ||
      "VIBE User";


    $("myAvatar").textContent =
      name.charAt(0).toUpperCase();


    try{

      await setDoc(

        doc(
          db,
          "users",
          user.uid
        ),

        {
          uid:user.uid,
          displayName:name,
          email:user.email || "",
          photoURL:user.photoURL || "",
          lastSeen:serverTimestamp(),
          online:true
        },

        {merge:true}

      );


      await loadUsers();

    }

    catch(error){

      console.error(error);

      showToast(
        "Couldn't load VIBE."
      );

    }


    $("loading").style.display =
      "none";

  }
);


/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers(){

  try{

    const snapshot =
      await getDocs(

        query(
          collection(db,"users"),
          limit(100)
        )

      );


    allUsers = [];


    snapshot.forEach(item => {

      const user =
        item.data();

      if(
        user.uid !==
        currentUser.uid
      ){

        allUsers.push(user);

      }

    });


    allUsers.sort(
      (a,b) =>
        (a.displayName || "")
          .localeCompare(
            b.displayName || ""
          )
    );


    renderSidebar();

  }

  catch(error){

    console.error(error);

    $("userList").innerHTML =
      `<div class="noUsers">
        Couldn't load users.
      </div>`;

  }

}


/* ==========================================
   SIDEBAR
========================================== */

function renderSidebar(){

  const list =
    $("userList");

  list.innerHTML = "";


  if(!allUsers.length){

    list.innerHTML =
      `<div class="noUsers">
        No other VIBE users yet.
      </div>`;

    return;

  }


  allUsers.forEach(user => {

    const button =
      document.createElement("button");

    button.className =
      "friend";


    if(
      selectedChat &&
      selectedChat.id ===
      user.uid
    ){

      button.classList.add("active");

    }


    const avatar =
      document.createElement("div");

    avatar.className =
      "friendAvatar";


    if(user.photoURL){

      avatar.innerHTML =
        `<img src="${user.photoURL}" alt="">`;

    }

    else{

      avatar.textContent =
        (
          user.displayName ||
          "V"
        )
          .charAt(0)
          .toUpperCase();

    }


    const info =
      document.createElement("div");

    info.className =
      "friendInfo";


    const name =
      document.createElement("div");

    name.className =
      "friendName";

    name.textContent =
      user.displayName ||
      "VIBE User";


    const preview =
      document.createElement("div");

    preview.className =
      "friendPreview";

    preview.textContent =
      "Direct message";


    info.appendChild(name);
    info.appendChild(preview);

    button.appendChild(avatar);
    button.appendChild(info);


    button.onclick =
      () => selectDM(user);


    list.appendChild(button);

  });

}


/* ==========================================
   SELECT DM
========================================== */

function selectDM(user){

  selectedChat = {

    type:"dm",

    id:user.uid,

    user:user

  };


  updateChatHeader(
    user.displayName || "VIBE User",
    user.photoURL,
    "● VIBE user"
  );


  $("messageInput").disabled =
    false;

  $("messageInput").placeholder =
    "Message " +
    (
      user.displayName ||
      "them"
    ) +
    "...";


  renderSidebar();

  loadConversation();

}


/* ==========================================
   CONVERSATION ID
========================================== */

function dmConversationId(userId){

  return [

    currentUser.uid,
    userId

  ].sort().join("_");

}


/* ==========================================
   LOAD DM
========================================== */

function loadDMConversation(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const id =
    dmConversationId(
      selectedChat.user.uid
    );


  const messagesRef =
    collection(
      db,
      "conversations",
      id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  subscribeMessages(messagesQuery);

}


/* ==========================================
   LOAD GROUP
========================================== */

function loadGroupConversation(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      selectedChat.id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  subscribeMessages(messagesQuery);

}


/* ==========================================
   MESSAGE SUBSCRIPTION
========================================== */

function subscribeMessages(messagesQuery){

  $("messages").innerHTML = "";


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        $("messages").innerHTML = "";


        if(snapshot.empty){

          $("messages").innerHTML = `

            <div class="welcome">

              <div class="welcomeIcon">
                ✦
              </div>

              <strong>
                Say hey 👋
              </strong>

              <p>
                Start your VIBE conversation.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(item => {

          addMessage(
            item.data(),
            item.data().senderId ===
              currentUser.uid
          );

        });

      },

      error => {

        console.error(error);

        showToast(
          "Couldn't load messages."
        );

      }

    );

}


/* ==========================================
   LOAD CONVERSATION
========================================== */

function loadConversation(){

  if(selectedChat.type === "group"){

    loadGroupConversation();

  }

  else{

    loadDMConversation();

  }

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedChat
  ){

    showToast(
      "Select a chat first."
    );

    return;

  }


  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text)
    return;


  try{

    let conversationId;
    let members;


    if(selectedChat.type === "group"){

      conversationId =
        selectedChat.id;

      members =
        selectedChat.members;

    }

    else{

      conversationId =
        dmConversationId(
          selectedChat.user.uid
        );

      members = [

        currentUser.uid,
        selectedChat.user.uid

      ];

    }


    await setDoc(

      doc(
        db,
        "conversations",
        conversationId
      ),

      {

        members:members,

        type:
          selectedChat.type,

        updatedAt:
          serverTimestamp()

      },

      {merge:true}

    );


    await addDoc(

      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),

      {

        text:text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          currentUser.email
            ?.split("@")[0] ||
          "VIBE User",

        createdAt:
          serverTimestamp(),

        clientTime:
          Date.now()

      }

    );


    input.value = "";

    input.focus();

  }

  catch(error){

    console.error(error);

    showToast(
      "Message couldn't send."
    );

  }

}


/* ==========================================
   MESSAGE UI
========================================== */

function addMessage(data,mine){

  const container =
    $("messages");


  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (mine ? " mine" : "");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    selectedChat &&
    selectedChat.type === "group" &&
    !mine
  ){

    const sender =
      document.createElement("div");

    sender.className =
      "senderName";

    sender.textContent =
      data.senderName ||
      "VIBE User";

    bubble.appendChild(sender);

  }


  const text =
    document.createElement("div");

  text.textContent =
    data.text || "";


  const time =
    document.createElement("span");

  time.className =
    "time";


  let timestamp =
    data.createdAt;


  if(
    timestamp &&
    typeof timestamp.toDate ===
    "function"
  ){

    timestamp =
      timestamp.toDate();

  }

  else if(data.clientTime){

    timestamp =
      new Date(data.clientTime);

  }

  else{

    timestamp =
      new Date();

  }


  time.textContent =
    formatTime(timestamp);


  bubble.appendChild(text);
  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);


  container.scrollTop =
    container.scrollHeight;

}


/* ==========================================
   HEADER
========================================== */

function updateChatHeader(
  name,
  photoURL,
  status
){

  $("headerName").textContent =
    name;


  $("personStatus").textContent =
    status;


  if(photoURL){

    $("headerAvatar").innerHTML =
      `<img src="${photoURL}" alt="">`;

  }

  else{

    $("headerAvatar").textContent =
      name
        .charAt(0)
        .toUpperCase();

  }

}


/* ==========================================
   GROUP MODAL
========================================== */

function openGroupModal(){

  $("groupNameInput").value = "";

  renderGroupUsers();

  $("groupModal")
    .classList
    .add("show");

}


function closeGroupModal(){

  $("groupModal")
    .classList
    .remove("show");

}


/* ==========================================
   GROUP USERS
========================================== */

function renderGroupUsers(){

  const list =
    $("groupUserList");

  list.innerHTML = "";


  if(!allUsers.length){

    list.innerHTML =
      `<div class="noUsers">
        There aren't any other VIBE users yet.
      </div>`;

    return;

  }


  allUsers.forEach(user => {

    const label =
      document.createElement("label");

    label.className =
      "selectUser";


    const checkbox =
      document.createElement("input");

    checkbox.type =
      "checkbox";

    checkbox.value =
      user.uid;


    const avatar =
      document.createElement("div");

    avatar.className =
      "selectAvatar";


    if(user.photoURL){

      avatar.innerHTML =
        `<img src="${user.photoURL}" alt="">`;

    }

    else{

      avatar.textContent =
        (
          user.displayName ||
          "V"
        )
          .charAt(0)
          .toUpperCase();

    }


    const name =
      document.createElement("span");

    name.textContent =
      user.displayName ||
      "VIBE User";


    label.appendChild(checkbox);
    label.appendChild(avatar);
    label.appendChild(name);


    list.appendChild(label);

  });

}


/* ==========================================
   CREATE GROUP
========================================== */

async function createGroup(){

  const name =
    $("groupNameInput")
      .value
      .trim();


  if(!name){

    showToast(
      "Give the group a name."
    );

    return;

  }


  const checked =
    [
      ...document
        .querySelectorAll(
          "#groupUserList input:checked"
        )
    ];


  if(!checked.length){

    showToast(
      "Choose at least one person."
    );

    return;

  }


  const selectedMembers =
    checked.map(
      checkbox =>
        checkbox.value
    );


  selectedMembers.push(
    currentUser.uid
  );


  const groupRef =
    doc(
      collection(
        db,
        "conversations"
      )
    );


  try{

    await setDoc(

      groupRef,

      {

        type:"group",

        name:name,

        members:selectedMembers,

        createdBy:
          currentUser.uid,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    selectedChat = {

      type:"group",

      id:groupRef.id,

      name:name,

      members:selectedMembers

    };


    updateChatHeader(
      name,
      null,
      selectedMembers.length +
      " members"
    );


    $("messageInput").disabled =
      false;

    $("messageInput").placeholder =
      "Message " + name + "...";


    closeGroupModal();

    renderSidebar();

    loadGroupConversation();

    showToast(
      "Group created ✦"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "Couldn't create group."
    );

  }

}


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(time){

  return new Date(time)
    .toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


/* ==========================================
   EMOJI
========================================== */

function addEmoji(){

  const input =
    $("messageInput");


  if(input.disabled)
    return;


  input.value +=
    " 😊";

  input.focus();

}


/* ==========================================
   ENTER
========================================== */

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* ==========================================
   VIDEO
========================================== */

function startVideo(){

  if(
    selectedChat &&
    selectedChat.type === "group"
  ){

    window.location.href =
      "video.html";

    return;

  }


  window.location.href =
    "video.html";

}


/* ==========================================
   PROFILE PICTURE
========================================== */

$("myAvatar").addEventListener(
  "click",
  () => {

    $("pfpInput").click();

  }
);


$("pfpInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if(
      !file ||
      !currentUser
    )
      return;


    if(
      file.size >
      5 * 1024 * 1024
    ){

      showToast(
        "PFP must be under 5 MB."
      );

      return;

    }


    if(
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(file.type)
    ){

      showToast(
        "Please choose JPG, PNG, or WebP."
      );

      return;

    }


    showToast(
      "Uploading PFP..."
    );


    try{

      const storageRef =
        ref(
          storage,
          "profilePictures/" +
          currentUser.uid
        );


      await uploadBytes(
        storageRef,
        file
      );


      const photoURL =
        await getDownloadURL(
          storageRef
        );


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {
          photoURL:photoURL
        },

        {merge:true}

      );


      $("myAvatar").innerHTML =
        `<img src="${photoURL}" alt="Profile">`;


      showToast(
        "Profile picture updated ✦"
      );

    }

    catch(error){

      console.error(error);

      showToast(
        "Couldn't upload PFP."
      );

    }


    event.target.value = "";

  }
);


/* ==========================================
   EXPOSE BUTTON FUNCTIONS
========================================== */

window.sendMessage =
  sendMessage;

window.addEmoji =
  addEmoji;

window.startVideo =
  startVideo;

window.openGroupModal =
  openGroupModal;

window.closeGroupModal =
  closeGroupModal;

window.createGroup =
  createGroup;

</script>
